name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compiler l'APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk LaBulleDeKiria.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LaBulleDeKiria-apk
          path: LaBulleDeKiria.apk

      # Publie l'APK dans « Releases » : téléchargement direct depuis le téléphone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: La Bulle de Kiria (version ${{ github.run_number }})
          files: LaBulleDeKiria.apk
          make_latest: true
