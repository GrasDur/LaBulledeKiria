plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.kiria.bulle'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.kiria.bulle'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '1.8'
    }

    // Clé de signature FIXE : indispensable pour qu'Android accepte
    // d'installer les nouvelles versions par-dessus l'ancienne (sans perte de données).
    signingConfigs {
        bulle {
            storeFile file('bulle-release.jks')
            storePassword 'bulledekiria'
            keyAlias 'bulle'
            keyPassword 'bulledekiria'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.bulle
        }
        debug {
            signingConfig signingConfigs.bulle
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
