<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>La Bulle de Kiria</title>
<style>
:root{
  --bg:#FBF7FF; --surface:#FFFFFF; --surface-2:#F4EEFC; --ink:#2B2240; --muted:#7D7396; --line:#ECE4F7;
  --primary:#8B5CF6; --primary-ink:#FFFFFF; --primary-soft:#EDE5FE; --accent:#EC4899; --accent-soft:#FCE7F3;
  --ok:#10B981; --warn:#F59E0B; --danger:#E11D48;
  --g1:#C4B5FD; --g2:#F9A8D4; --g3:#A5F3FC;
  --shadow:0 6px 24px rgba(91,52,160,.10); --radius:22px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14101E; --surface:#201933; --surface-2:#2A2142; --ink:#F2EDFB; --muted:#A79DC2; --line:#33294D;
    --primary:#A78BFA; --primary-ink:#1A1329; --primary-soft:#33275A; --accent:#F472B6; --accent-soft:#4A2140;
    --g1:#6D4FC4; --g2:#9D3E78; --g3:#2D6F7E; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
img{display:block}
#view{padding:0 16px calc(96px + env(safe-area-inset-bottom));min-height:100%}
h1,h2,h3{margin:0}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Header bubbles */
.hero{position:relative;margin:0 -16px 8px;padding:28px 20px 22px;overflow:hidden;border-radius:0 0 32px 32px;
  background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft))}
.hero .b{position:absolute;border-radius:50%;opacity:.55;filter:blur(1px);animation:float 9s ease-in-out infinite}
.hero .b1{width:120px;height:120px;right:-30px;top:-30px;background:radial-gradient(circle at 30% 30%,#fff8,var(--g1))}
.hero .b2{width:60px;height:60px;right:70px;top:50px;background:radial-gradient(circle at 30% 30%,#fff8,var(--g2));animation-delay:-3s}
.hero .b3{width:34px;height:34px;left:58%;bottom:12px;background:radial-gradient(circle at 30% 30%,#fff8,var(--g3));animation-delay:-6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{font-family:var(--serif);font-size:27px;font-weight:700;letter-spacing:-.3px}
.hero .date{color:var(--muted);font-size:14px;margin-top:4px;text-transform:capitalize}
.brand{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--primary);margin-bottom:6px}

.goal{position:relative;display:flex;align-items:center;gap:16px;margin-top:18px;background:var(--surface);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.goal .txt b{font-size:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.chip.p{background:var(--primary-soft);color:var(--primary)}
.chip.a{background:var(--accent-soft);color:var(--accent)}

.section{margin-top:24px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.section-h h2{font-size:19px;font-family:var(--serif)}
.link{color:var(--primary);font-weight:600;font-size:14px}

/* cards */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.reading-card{display:flex;gap:14px;margin-bottom:12px}
.reading-card .info{flex:1;min-width:0;display:flex;flex-direction:column}
.title{font-weight:700;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.author{color:var(--muted);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:14px;font-weight:650;font-size:14px;background:var(--surface-2);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.accent{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.btn.danger{background:transparent;color:var(--danger)}
.btn.block{width:100%;padding:14px}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:12px}

/* covers */
.cover{flex:none;border-radius:10px;overflow:hidden;background:var(--surface-2);box-shadow:0 4px 12px rgba(0,0,0,.12);position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:8px;color:#fff;font-family:var(--serif);font-weight:700;font-size:12px;line-height:1.15;text-shadow:0 1px 2px #0004}
.c-sm{width:64px;height:96px}
.c-md{width:78px;height:116px}
.c-lg{width:130px;height:196px;border-radius:14px}

.hscroll{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{width:96px;flex:none}
.mini .cover{width:96px;height:144px}
.mini .t{font-size:13px;font-weight:650;margin-top:8px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* library */
.page-h{padding:24px 0 12px;display:flex;align-items:center;justify-content:space-between}
.page-h h1{font-family:var(--serif);font-size:28px}
.seg{display:flex;background:var(--surface-2);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 2px;border-radius:12px;font-weight:650;font-size:12.5px;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.seg .n{font-size:11.5px;opacity:.8;margin-left:3px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 14px;margin:12px 0}
.search input{flex:1;border:0;background:none;padding:13px 0;outline:none;font-size:15px}
.search:focus-within{border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:18px 14px}
.gitem .cover{width:100%;aspect-ratio:2/3;height:auto}
.gitem .t{font-size:13px;font-weight:650;margin-top:8px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gitem .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitem .bar{height:5px;margin-top:6px}
.stars{color:#F5B301;font-size:12px;letter-spacing:1px}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .bubble{width:92px;height:92px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;
  background:radial-gradient(circle at 30% 30%,#fff9,var(--g1) 60%,var(--g2))}
.empty h3{color:var(--ink);font-family:var(--serif);font-size:20px;margin-bottom:6px}

/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:24px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .ic{font-size:18px}
.chart-card{margin-top:14px}
.chart-card h3{font-size:15px;margin-bottom:2px}
svg text{fill:var(--muted);font-family:var(--font)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:1fr;gap:4px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2)}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:8px;font-size:11px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* tab bar */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;background:var(--surface);border-radius:26px;box-shadow:0 10px 30px rgba(60,30,110,.18);padding:6px;z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:11px;font-weight:650;color:var(--muted);border-radius:18px}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--primary)}
.tabbar .fab{flex:none;width:54px;height:54px;margin:-26px 6px 0;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;box-shadow:0 8px 20px rgba(139,92,246,.45);justify-content:center}
.tabbar .fab svg{width:28px;height:28px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,10,40,.45);z-index:40;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--bg);border-radius:28px 28px 0 0;z-index:41;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 4px;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;flex:none}
.sheet .sh h2{font-family:var(--serif);font-size:21px}
.sheet .sb{overflow-y:auto;padding:4px 18px 24px;-webkit-overflow-scrolling:touch}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:18px}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;outline:none;font-size:15px}
.field input:focus,.field textarea:focus{border-color:var(--primary)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.result{display:flex;gap:12px;align-items:center;cursor:pointer;padding:10px;border-radius:16px;background:var(--surface);margin-bottom:10px}
.result .info{flex:1;min-width:0}
.result .add{width:40px;height:40px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:22px;font-weight:700;flex:none}
.result .add.done{background:var(--ok);color:#fff;font-size:16px}

.detail-top{display:flex;gap:16px;align-items:flex-end;margin-bottom:16px}
.detail-top h2{font-family:var(--serif);font-size:22px;line-height:1.2}
.pills{display:flex;gap:6px;margin:14px 0}
.pills button{flex:1;padding:10px 2px;white-space:nowrap;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-weight:650;font-size:13px}
.pills button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.desc{font-size:14.5px;line-height:1.55;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.desc.open{-webkit-line-clamp:unset;display:block}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist:last-child{border:0}
.hist>.cover{width:40px;height:60px;border-radius:6px}
.hist .dot{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.rate button{font-size:30px;color:var(--line);padding:0 2px}
.rate button.on{color:#F5B301}

/* session */
.session{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;
  background:linear-gradient(160deg,#5B3BB5,#8B5CF6 45%,#EC4899);transform:translateY(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s}
.session.show{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.session .sb1,.session .sb2,.session .sb3{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffffff55,#ffffff10);animation:float 7s ease-in-out infinite}
.session .sb1{width:180px;height:180px;left:-50px;top:10%}
.session .sb2{width:90px;height:90px;right:20px;top:22%;animation-delay:-2s}
.session .sb3{width:130px;height:130px;right:-30px;bottom:12%;animation-delay:-4s}
.session .lbl{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8;font-weight:700}
.session .bt{font-family:var(--serif);font-size:22px;font-weight:700;margin:8px 0 30px;max-width:320px;position:relative}
.timer{font-size:72px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-2px;position:relative}
.session .ctrls{display:flex;gap:16px;margin-top:40px;position:relative}
.session .ctrls button{width:72px;height:72px;border-radius:50%;background:#ffffff2e;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.session .ctrls button.stop{background:#fff;color:#8B5CF6}
.session .hint{margin-top:16px;font-size:13px;opacity:.8;position:relative}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:28px;height:28px;border:3px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:sp 0.8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.pop{position:fixed;border-radius:50%;pointer-events:none;z-index:95;animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{transform:translateY(0) scale(.4);opacity:1}100%{transform:translateY(-70vh) scale(1.1);opacity:0}}
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6.5A2.5 2.5 0 0 0 4 20.5 2.5 2.5 0 0 0 6.5 23H19"/><path d="M8 7h7"/></svg>Biblio</button>
  <button class="fab" id="fab" aria-label="Ajouter un livre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Moi</button>
</nav>

<div id="sheets"></div>

<div class="session" id="session">
  <div class="sb1"></div><div class="sb2"></div><div class="sb3"></div>
  <div class="lbl">Session de lecture</div>
  <div class="bt" id="ses-title"></div>
  <div class="timer" id="ses-timer">00:00</div>
  <div class="ctrls">
    <button id="ses-pause" aria-label="Pause">❚❚</button>
    <button class="stop" id="ses-stop" aria-label="Terminer">■</button>
  </div>
  <div class="hint" id="ses-hint">Bonne lecture dans ta bulle ✨</div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ---------- Données ---------- */
const KEY = 'kiria.v1';
const DEFAULT = { books: [], logs: [], settings: { name: 'Kiria', dailyGoal: 20, frOnly: false }, session: null };
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || structuredClone(DEFAULT); } catch (e) { S = structuredClone(DEFAULT); }
S.settings = Object.assign({}, DEFAULT.settings, S.settings || {});
S.books = S.books || []; S.logs = S.logs || [];
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Impossible d’enregistrer'); } }

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const dayKey = (d = new Date()) => { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const book = id => S.books.find(b => b.id === id);
const pct = b => b.pages ? Math.min(100, Math.round((b.currentPage || 0) / b.pages * 100)) : (b.status === 'read' ? 100 : 0);
function fmtDur(sec, short) {
  sec = Math.round(sec || 0); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  if (h) return h + ' h' + (m ? ' ' + String(m).padStart(2, '0') : '');
  if (m) return m + ' min';
  return short ? '0 min' : sec + ' s';
}
const fmtDate = (d, o = { day: 'numeric', month: 'short' }) => new Date(d).toLocaleDateString('fr-FR', o);
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
function bubbles() {
  const cols = ['#C4B5FD', '#F9A8D4', '#A5F3FC', '#FDE68A', '#8B5CF6'];
  for (let i = 0; i < 18; i++) {
    const e = document.createElement('div'); const s = 12 + Math.random() * 30;
    e.className = 'pop'; e.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}vw;bottom:${-20 + Math.random() * 60}px;animation-delay:${Math.random() * .5}s;background:radial-gradient(circle at 30% 30%,#fffb,${cols[i % 5]})`;
    document.body.appendChild(e); setTimeout(() => e.remove(), 2400);
  }
}


/* ---------- Réseau (via Android quand disponible : pas de blocage CORS) ---------- */
const pendingHttp = {};
window.__kiriaHttp = (id, code, body, err) => {
  const p = pendingHttp[id]; if (!p) return; delete pendingHttp[id];
  (code >= 200 && code < 300 && body != null) ? p.res(body) : p.rej(new Error(code ? 'HTTP ' + code : (err || 'réseau')));
};
function nativeGet(url, signal) {
  return new Promise((res, rej) => {
    const id = uid(); pendingHttp[id] = { res, rej };
    signal && signal.addEventListener('abort', () => { if (pendingHttp[id]) { delete pendingHttp[id]; rej(new DOMException('Annulé', 'AbortError')); } });
    setTimeout(() => { if (pendingHttp[id]) { delete pendingHttp[id]; rej(new Error('délai dépassé')); } }, 25000);
    KiriaAndroid.httpGet(id, url);
  });
}
async function httpText(url, signal) {
  let first;
  if (window.KiriaAndroid && typeof KiriaAndroid.httpGet === 'function') {
    try { return await nativeGet(url, signal); } catch (e) { if (e.name === 'AbortError') throw e; first = e; }
  }
  try {
    const r = await fetch(url, { signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.text();
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    throw new Error((first ? 'natif: ' + first.message + ' / ' : '') + 'web: ' + e.message);
  }
}
const searchInfo = {};

/* ---------- Catalogue BnF (toutes les éditions publiées en France) ---------- */
const DC = 'http://purl.org/dc/elements/1.1/';
function bnfParse(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const recs = [...doc.getElementsByTagNameNS('*', 'dc')];
  return recs.map(r => {
    const all = n => [...r.getElementsByTagNameNS(DC, n)].map(e => e.textContent.trim());
    const one = n => all(n)[0] || '';
    let title = one('title').split(' / ')[0].replace(/\[[^\]]*\]/g, '').replace(/\s+:\s+roman$/i, '').trim();
    const author = all('creator').map(c => {
      c = c.split(/\.\s/)[0].replace(/\([^)]*\)/g, '').trim().replace(/\.$/, '');
      const [last, first] = c.split(',').map(x => x && x.trim());
      return first ? first + ' ' + last : last;
    }).filter(Boolean).join(', ');
    const fmt = all('format').join(' ');
    const pages = +((fmt.match(/(\d+)\s*p\./) || [])[1] || 0);
    const isbn = ((all('identifier').find(x => /ISBN/i.test(x)) || '').match(/[\dXx-]{10,17}/) || [''])[0].replace(/-/g, '');
    const ark = ((all('identifier').find(x => /ark:/.test(x)) || '').match(/ark:\/12148\/\w+/) || [''])[0];
    const publisher = (one('publisher').split(' : ')[0] || '').replace(/\s*\([^)]*\)\s*/g, ' ').trim();
    const year = (one('date').match(/\d{4}/) || [''])[0];
    const lang = all('language').some(l => /^fre|^fra|fran/i.test(l)) ? 'fr' : (all('language').some(l => /^eng|angl/i.test(l)) ? 'en' : '');
    const type = all('type').join(' ').toLowerCase();
    return { key: ark || isbn || title, title, author, pages, isbn, publisher, year, lang, description: '', source: 'BnF', type,
      cover: isbn ? `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false` : '',
      cover2: ark ? `https://catalogue.bnf.fr/couverture?&appName=NE&idArk=${ark}&couverture=1` : '' };
  }).filter(b => b.title && !/sonore|vidéo|musique|partition/.test(b.type));
}
async function bnfSearch(term, isIsbn, signal) {
  const clean = term.replace(/"/g, ' ').trim();
  const cql = isIsbn ? `bib.isbn all "${clean.replace(/[-\s]/g, '')}"` : `bib.anywhere all "${clean}"`;
  const url = 'https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&recordSchema=dublincore&maximumRecords=25&query=' + encodeURIComponent(cql);
  try {
    const r = bnfParse(await httpText(url, signal));
    searchInfo.bnf = '✓ ' + r.length; return r;
  } catch (e) { if (e.name !== 'AbortError') searchInfo.bnf = '✗ ' + e.message; throw e; }
}

/* ---------- Couvertures ---------- */
const PALETTES = [['#8B5CF6', '#EC4899'], ['#6366F1', '#06B6D4'], ['#F59E0B', '#EF4444'], ['#10B981', '#3B82F6'], ['#A855F7', '#6366F1'], ['#F472B6', '#FB923C']];
function coverHTML(b, cls) {
  const h = [...(b.title || '?')].reduce((a, c) => a + c.charCodeAt(0), 0) % PALETTES.length;
  const [c1, c2] = PALETTES[h];
  const ph = `<div class="ph" style="background:linear-gradient(150deg,${c1},${c2})">${esc((b.title || '').slice(0, 40))}</div>`;
  const src = b.cover || b.cover2;
  const alt = b.cover && b.cover2 ? ` data-alt="${esc(b.cover2)}"` : '';
  const img = src ? `<img src="${esc(src)}"${alt} alt="" loading="lazy" onerror="if(this.dataset.alt){this.src=this.dataset.alt;delete this.dataset.alt}else this.remove()" onload="if(this.naturalWidth<20)this.onerror()" style="position:relative;z-index:1">` : '';
  return `<div class="cover ${cls}">${ph}${img}</div>`;
}

/* ---------- PAL & Wishlist ---------- */
const STATUS = { wish: '💫 Wishlist', toread: '🫧 PAL', reading: '📖 En cours', read: '🏁 Lu' };
function palList() { return S.books.filter(b => b.status === 'toread').sort((a, b) => (a.palOrder ?? a.addedAt) - (b.palOrder ?? b.addedAt)); }
function palNext() { return Math.max(0, ...S.books.filter(b => b.status === 'toread').map(b => b.palOrder || 0)) + 1; }
function movePal(id, dir) {
  const l = palList(); l.forEach((b, i) => b.palOrder = i + 1);
  const i = l.findIndex(b => b.id === id), j = i + dir; if (i < 0 || j < 0 || j >= l.length) return;
  [l[i].palOrder, l[j].palOrder] = [l[j].palOrder, l[i].palOrder]; save(); render();
}
function daysUntil(d) { if (!d) return null; const t = new Date(d + 'T00:00:00'); const n = new Date(); n.setHours(0, 0, 0, 0); return Math.round((t - n) / 864e5); }
function releaseLabel(b) {
  const n = daysUntil(b.releaseDate); if (n === null) return 'Date de sortie inconnue';
  if (n > 1) return `Sort dans ${n} jours · ${fmtDate(b.releaseDate + 'T00:00:00', { day: 'numeric', month: 'long', year: 'numeric' })}`;
  if (n === 1) return 'Sort demain !'; if (n === 0) return 'Sort aujourd’hui ! 🎉';
  return 'Déjà disponible depuis le ' + fmtDate(b.releaseDate + 'T00:00:00', { day: 'numeric', month: 'long', year: 'numeric' });
}

/* ---------- Statistiques ---------- */
function dayTotals() {
  const m = {};
  for (const l of S.logs) { const k = l.date; (m[k] ||= { pages: 0, sec: 0 }); m[k].pages += l.pages || 0; m[k].sec += l.seconds || 0; }
  return m;
}
function streak() {
  const m = dayTotals(); let n = 0; const d = new Date();
  if (!m[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (m[dayKey(d)] && (m[dayKey(d)].pages > 0 || m[dayKey(d)].sec > 0)) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function ring(value, max, size = 64, stroke = 7, label) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = Math.min(1, max ? value / max : 0);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">
    <defs><linearGradient id="rg${size}" x1="0" x2="1"><stop offset="0" stop-color="var(--primary)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="url(#rg${size})" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dashoffset .6s"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" style="fill:var(--ink);font-weight:750;font-size:${size / 4.6}px">${label ?? Math.round(p * 100) + '%'}</text></svg>`;
}

/* ---------- Statistiques ---------- */
function viewStats() {
  const m = dayTotals();
  const totalPages = S.logs.reduce((a, l) => a + (l.pages || 0), 0);
  const totalSec = S.logs.reduce((a, l) => a + (l.seconds || 0), 0);
  const read = S.books.filter(b => b.status === 'read');
  const sesPages = S.logs.filter(l => l.type === 'session' && l.seconds > 60);
  const pace = sesPages.reduce((a, l) => a + l.pages, 0) / (sesPages.reduce((a, l) => a + l.seconds, 0) / 3600 || 1);
  let h = `<div class="page-h"><h1>Statistiques</h1></div>
  <div class="kpis">
    <div class="kpi"><div class="ic">📚</div><div class="v">${read.length}</div><div class="l">Livres lus</div></div>
    <div class="kpi"><div class="ic">📖</div><div class="v">${totalPages.toLocaleString('fr-FR')}</div><div class="l">Pages lues</div></div>
    <div class="kpi"><div class="ic">⏱</div><div class="v">${fmtDur(totalSec, true)}</div><div class="l">Temps de lecture</div></div>
    <div class="kpi"><div class="ic">🔥</div><div class="v">${streak()} j</div><div class="l">Série en cours</div></div>
  </div>`;
  // 14 derniers jours
  const days = []; for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const vals = days.map(d => (m[dayKey(d)] || {}).pages || 0);
  const goal = +S.settings.dailyGoal || 0;
  const max = Math.max(goal, ...vals, 10);
  const W = 340, H = 150, pb = 22, bw = W / 14;
  let bars = '';
  vals.forEach((v, i) => {
    const bh = v / max * (H - pb - 10); const x = i * bw + bw * .18, w = bw * .64;
    bars += `<rect x="${x}" y="${H - pb - bh}" width="${w}" height="${Math.max(bh, v ? 3 : 0)}" rx="${w / 2.6}" fill="url(#bg)"/>`;
    if (i % 2 === 1 || i === 13) bars += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" font-size="10">${i === 13 ? 'auj.' : days[i].getDate()}</text>`;
  });
  const gy = H - pb - goal / max * (H - pb - 10);
  h += `<div class="card chart-card"><h3>Pages par jour</h3><div class="muted small">14 derniers jours · ${vals.reduce((a, b) => a + b, 0)} pages</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:10px"><defs><linearGradient id="bg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--primary)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${H - pb}" y2="${H - pb}" stroke="var(--line)"/>
    ${goal ? `<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--accent)" stroke-dasharray="4 4" opacity=".6"/><text x="2" y="${gy - 4}" font-size="10">objectif ${goal} p.</text>` : ''}
    ${bars}</svg></div>`;
  // heatmap 12 semaines
  const start = new Date(); start.setDate(start.getDate() - 83 - ((start.getDay() + 6) % 7 === 6 ? 0 : 0));
  const offset = (start.getDay() + 6) % 7; start.setDate(start.getDate() - offset);
  let cells = ''; const today = new Date();
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const v = (m[dayKey(d)] || {}).pages || 0;
    const lv = v === 0 ? 0 : v < 10 ? 1 : v < 25 ? 2 : v < 50 ? 3 : 4;
    const op = [0, .3, .55, .8, 1][lv];
    cells += `<i title="${fmtDate(d)} : ${v} p." style="${lv ? `background:color-mix(in srgb,var(--primary) ${op * 100}%,var(--surface-2))` : ''}"></i>`;
  }
  h += `<div class="card chart-card"><h3>Régularité</h3><div class="muted small">12 dernières semaines</div><div class="heat">${cells}</div>
    <div class="legend">moins ${[0, .3, .55, .8, 1].map(o => `<i style="background:${o ? `color-mix(in srgb,var(--primary) ${o * 100}%,var(--surface-2))` : 'var(--surface-2)'}"></i>`).join('')} plus</div></div>`;
  // livres terminés par mois
  const months = []; for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); months.push(d); }
  const mv = months.map(d => read.filter(b => b.finishedAt && new Date(b.finishedAt).getMonth() === d.getMonth() && new Date(b.finishedAt).getFullYear() === d.getFullYear()).length);
  const mmax = Math.max(...mv, 2); const mbw = W / 6;
  let mb = '';
  mv.forEach((v, i) => {
    const bh = v / mmax * (H - pb - 18); const x = i * mbw + mbw * .25, w = mbw * .5;
    mb += `<rect x="${x}" y="${H - pb - bh}" width="${w}" height="${bh}" rx="8" fill="var(--accent)" opacity=".85"/>`;
    if (v) mb += `<text x="${x + w / 2}" y="${H - pb - bh - 5}" text-anchor="middle" font-size="11" style="fill:var(--ink);font-weight:700">${v}</text>`;
    mb += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" font-size="10">${months[i].toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '')}</text>`;
  });
  h += `<div class="card chart-card"><h3>Livres terminés</h3><div class="muted small">6 derniers mois</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:10px"><line x1="0" x2="${W}" y1="${H - pb}" y2="${H - pb}" stroke="var(--line)"/>${mb}</svg></div>`;
  h += `<div class="kpis" style="margin-top:14px">
    <div class="kpi"><div class="l">Rythme moyen</div><div class="v">${sesPages.length ? Math.round(pace) : '—'}</div><div class="l">pages / heure</div></div>
    <div class="kpi"><div class="l">Sessions</div><div class="v">${S.logs.filter(l => l.type === 'session').length}</div><div class="l">au total</div></div></div>`;
  return h;
}

/* ---------- Feuilles (bottom sheets) ---------- */
const stack = [];
function openSheet(title, body) {
  const root = document.getElementById('sheets');
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = `<div class="grab"></div><div class="sh"><h2>${title}</h2><button class="x" aria-label="Fermer">✕</button></div><div class="sb">${body}</div>`;
  root.append(scrim, sh);
  scrim.onclick = closeSheet; sh.querySelector('.x').onclick = closeSheet;
  requestAnimationFrame(() => { scrim.classList.add('show'); sh.classList.add('show'); });
  stack.push({ scrim, sh });
  return sh;
}
function closeSheet() {
  const s = stack.pop(); if (!s) return;
  s.scrim.classList.remove('show'); s.sh.classList.remove('show');
  setTimeout(() => { s.scrim.remove(); s.sh.remove(); }, 300);
}
function closeAll() { while (stack.length) closeSheet(); }

/* La langue réelle d'une édition se lit dans son ISBN (978-2 / 979-10 = édition francophone) */
function isbn13(s) {
  s = String(s || '').replace(/[^0-9Xx]/g, '');
  if (s.length === 10) { const b = '978' + s.slice(0, 9); let sum = 0; for (let i = 0; i < 12; i++) sum += (+b[i]) * (i % 2 ? 3 : 1); return b + ((10 - sum % 10) % 10); }
  return s.length === 13 ? s : '';
}
function isbnLang(s) {
  const i = isbn13(s); if (!i) return '';
  if (i.startsWith('9782') || i.startsWith('97910')) return 'fr';
  if (i.startsWith('9780') || i.startsWith('9781')) return 'en';
  if (i.startsWith('9783')) return 'de';
  if (i.startsWith('97884')) return 'es';
  if (i.startsWith('97888') || i.startsWith('97912')) return 'it';
  if (i.startsWith('97890') || i.startsWith('97894')) return 'nl';
  return '';
}
function gbMap(it) {
  const v = it.volumeInfo || {}; const ids = v.industryIdentifiers || [];
  const im = v.imageLinks || {};
  const cover = (im.thumbnail || im.smallThumbnail || '').replace('http://', 'https://').replace('&edge=curl', '');
  const raw = (ids.find(i => i.type === 'ISBN_13') || ids.find(i => i.type === 'ISBN_10') || {}).identifier || '';
  return { key: 'g' + it.id, title: v.title + (v.subtitle && v.title.length < 30 ? ' – ' + v.subtitle : ''), author: (v.authors || []).join(', '), pages: v.pageCount || 0,
    cover, year: (v.publishedDate || '').slice(0, 4), publisher: v.publisher || '', isbn: isbn13(raw) || raw,
    description: v.description || '', genre: (v.categories || [])[0] || '', lang: v.language || '', source: 'Google' };
}
function olMap(x) {
  const e = (x.editions && x.editions.docs && x.editions.docs[0]) || {};
  const isbn = ((e.isbn || x.isbn || []).map(isbn13).filter(Boolean))[0] || '';
  const langs = e.language || x.language || [];
  const cov = e.cover_i || x.cover_i;
  return { key: 'o' + (e.key || x.key), title: e.title || x.title, author: (x.author_name || []).join(', '), pages: e.number_of_pages_median || x.number_of_pages_median || 0,
    cover: cov ? `https://covers.openlibrary.org/b/id/${cov}-M.jpg` : (isbn ? `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false` : ''),
    year: ((e.publish_date || [])[0] || '').match(/\d{4}/)?.[0] || (x.first_publish_year ? String(x.first_publish_year) : ''),
    publisher: (e.publisher || x.publisher || [])[0] || '', isbn, description: '',
    lang: langs.includes('fre') ? 'fr' : (langs.includes('eng') ? 'en' : ''), source: 'Open Library' };
}
async function searchBooks(term, signal, frOnly) {
  const rawIsbn = term.replace(/[-\s]/g, '');
  const isIsbn = /^(\d{9}[\dXx]|\d{13})$/.test(rawIsbn);
  const q = encodeURIComponent(isIsbn ? 'isbn:' + rawIsbn : term);
  const gbase = 'https://www.googleapis.com/books/v1/volumes?maxResults=40&printType=books&q=' + q;
  const ol = 'https://openlibrary.org/search.json?limit=20&lang=fr&fields=key,title,author_name,first_publish_year,number_of_pages_median,cover_i,isbn,publisher,language,editions,editions.key,editions.title,editions.isbn,editions.publisher,editions.language,editions.cover_i,editions.number_of_pages_median,editions.publish_date&'
    + (isIsbn ? 'isbn=' + rawIsbn : 'q=' + encodeURIComponent(term));
  const soft = p => p.catch(e => { if (e.name === 'AbortError') throw e; return null; });
  const gget = u => soft(fetch(u, { signal }).then(r => r.json()).then(d => (d.items || []).map(gbMap)));
  searchInfo.bnf = '…';
  const [gfr, gall, olr, bn] = await Promise.all([
    gget(gbase + '&langRestrict=fr'), gget(gbase),
    soft(fetch(ol, { signal }).then(r => r.json()).then(d => (d.docs || []).map(olMap))),
    soft(bnfSearch(term, isIsbn, signal))]);
  if (!gfr && !gall && !olr && !bn) throw new Error('offline');

  // Fusion : une seule fiche par ISBN, en gardant le meilleur de chaque source
  const byKey = new Map();
  for (const b of [...(bn || []), ...(gfr || []), ...(gall || []), ...(olr || [])]) {
    if (!b.title) continue;
    b.isbn = isbn13(b.isbn) || b.isbn || '';
    const il = isbnLang(b.isbn);
    b.langSure = !!il || b.source === 'BnF';
    if (il) b.lang = il;
    const k = b.isbn || b.key;
    const prev = byKey.get(k);
    if (!prev) { byKey.set(k, b); continue; }
    for (const f of ['cover', 'description', 'genre', 'pages', 'publisher', 'year', 'author']) if (!prev[f] && b[f]) prev[f] = b[f];
    if (b.source === 'Google' && b.cover && prev.source !== 'Google') prev.cover = b.cover;
  }
  let out = [...byKey.values()];
  if (frOnly) out = out.filter(b => b.lang === 'fr');
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const words = norm(term).split(/[\s'’-]+/).filter(w => w.length > 2);
  const hit = b => words.filter(w => norm(b.title + ' ' + b.author).includes(w.replace(/s$/, ''))).length / (words.length || 1);
  out = out.map((b, i) => ({ b, s: (b.lang === 'fr' ? (b.langSure ? 100 : 50) : 0) + hit(b) * 70 + (b.cover ? 10 : 0) + (b.pages ? 4 : 0) + (b.source === 'BnF' ? 4 : 0) + (+b.year > 2000 ? 3 : 0) - i * .05 }))
    .sort((x, y) => y.s - x.s).map(x => x.b);
  searchInfo.sources = ['Google ' + (gall || gfr ? '✓' : '✗'), 'Open Library ' + (olr ? '✓' : '✗'), 'BnF ' + (searchInfo.bnf || '')].join(' · ');
  return out.slice(0, 40);
}

/* ---------- Compléter une fiche (couverture, résumé) ---------- */
async function enrichBook(b) {
  const isbn = isbn13(b.isbn);
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  const found = {};
  const take = x => { for (const f of ['cover', 'description', 'pages', 'publisher', 'year', 'genre']) if (!found[f] && x[f]) found[f] = x[f]; };
  const tries = [];
  if (isbn) tries.push(fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:' + isbn).then(r => r.json()).then(d => (d.items || []).map(gbMap).forEach(take)));
  if (b.title) tries.push(fetch('https://www.googleapis.com/books/v1/volumes?maxResults=20&langRestrict=fr&q=' + encodeURIComponent('intitle:' + b.title + (b.author ? ' inauthor:' + b.author.split(',')[0] : '')))
    .then(r => r.json()).then(d => (d.items || []).map(gbMap).filter(x => norm(x.title).startsWith(norm(b.title).slice(0, 12)) && (isbnLang(x.isbn) === 'fr' || (!x.isbn && x.lang === 'fr')))
      .sort((x, y) => (y.isbn === isbn) - (x.isbn === isbn)).forEach(take)));
  await Promise.all(tries.map(t => t.catch(() => null)));
  if (!found.cover && isbn) {
    const ok = await new Promise(res => { const i = new Image(); i.onload = () => res(i.naturalWidth > 20); i.onerror = () => res(false); i.src = `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`; setTimeout(() => res(false), 8000); });
    if (ok) found.cover = `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`;
  }
  return found;
}

/* Image de la galerie → petite image JPEG gardée dans l'app */
function pickImage() {
  return new Promise((res, rej) => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return rej(new Error('aucune image'));
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          const H = 480, scale = Math.min(1, H / img.height);
          const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => rej(new Error('image illisible')); img.src = fr.result;
      };
      fr.readAsDataURL(f);
    };
    inp.click();
  });
}

    <div class="field"><label>…ou lien d’une image de couverture</label><input id="e-cover" type="url" placeholder="https://…" value="${esc(cover.startsWith('data:') ? '' : cover)}"></div>
    <button class="btn primary block" id="e-save">${id ? 'Enregistrer' : 'Continuer'}</button>`);
  const $ = k => sh.querySelector('#e-' + k);
  const draw = () => { $('cv').innerHTML = coverHTML({ title: $('title').value || b.title, cover, cover2 }, 'c-md'); };
  draw();
  $('title').oninput = draw;
  $('cover').onchange = () => { cover = $('cover').value.trim(); cover2 = ''; draw(); };
  $('pick').onclick = async () => { try { cover = await pickImage(); cover2 = ''; $('cover').value = ''; draw(); toast('Couverture ajoutée 🖼'); } catch (e) { } };
  $('nocv').onclick = () => { cover = ''; cover2 = ''; $('cover').value = ''; draw(); };
  $('auto').onclick = async () => {
    const btn = $('auto'); btn.textContent = '⏳ Recherche…'; btn.disabled = true;
    const f = await enrichBook({ title: $('title').value.trim(), author: $('author').value.trim(), isbn: $('isbn').value.trim() });
    let n = 0;
    if (f.cover && !cover.startsWith('data:')) { cover = f.cover; cover2 = ''; $('cover').value = f.cover; draw(); n++; }
    if (f.description && !$('desc').value.trim()) { $('desc').value = f.description.replace(/<[^>]+>/g, ''); n++; }
    if (f.pages && !$('pages').value) { $('pages').value = f.pages; }
    btn.textContent = '✨ Trouver couverture & résumé'; btn.disabled = false;
    toast(n ? 'Infos trouvées ✨' : 'Rien trouvé — tu peux les ajouter à la main');
  };
  $('save').onclick = () => {
    const v = k => $(k).value.trim();
    if (!v('title')) { toast('Le titre est obligatoire'); return; }
    const data = { title: v('title'), author: v('author'), pages: Math.max(0, parseInt(v('pages')) || 0), year: v('year') || (v('release') || '').slice(0, 4),
      publisher: v('pub'), isbn: v('isbn'), cover, cover2, description: v('desc'), releaseDate: v('release') };
    if (data.isbn && isbnLang(data.isbn)) data.lang = isbnLang(data.isbn);
    if (id) { Object.assign(b, data); if (b.status === 'read') b.currentPage = b.pages; save(); closeSheet(); closeSheet(); openBook(id); render(); toast('Fiche enregistrée'); }
    else { closeSheet(); chooseStatus(data); }
  };
}

/* ---------- Fiche livre ---------- */
function openBook(id) {
  const b = book(id); if (!b) return;
  const logs = S.logs.filter(l => l.bookId === id).sort((a, c) => c.at - a.at);
  const totalSec = logs.reduce((a, l) => a + (l.seconds || 0), 0);
  const chips = [b.lang ? langBadge(b.lang) : '', b.pages ? `📄 ${b.pages} pages` : '', b.year ? `📅 ${esc(b.year)}` : '', b.publisher ? `🏢 ${esc(b.publisher)}` : '', b.genre ? `🏷 ${esc(b.genre)}` : '', totalSec ? `⏱ ${fmtDur(totalSec)}` : '']
    .filter(Boolean).map(c => `<span class="chip">${c}</span>`).join('');
  let main = '';
  if (b.status === 'reading') {
    const left = b.pages ? b.pages - (b.currentPage || 0) : 0;
    main = `<div class="card row" style="gap:16px">${ring(b.currentPage || 0, b.pages || 0, 76, 8)}
      <div style="flex:1"><div style="font-weight:700;font-size:17px">${b.pages ? `Page ${b.currentPage || 0} / ${b.pages}` : `Page ${b.currentPage || 0}`}</div>
      <div class="muted small">${b.pages ? `Encore ${left} page${left > 1 ? 's' : ''}` : 'Ajoute le nombre de pages via « Modifier »'}</div>
      ${b.startedAt ? `<div class="muted small">Commencé le ${fmtDate(b.startedAt, { day: 'numeric', month: 'long' })}</div>` : ''}</div></div>
      <div class="row" style="margin-top:12px;gap:10px"><button class="btn accent" style="flex:1;padding:13px" data-session="${b.id}">▶ Démarrer une session</button><button class="btn" style="padding:13px" data-progress="${b.id}">＋ Pages</button></div>`;
  } else if (b.status === 'toread') {
    const pos = palList().findIndex(x => x.id === b.id) + 1;
    main = `<div class="muted small" style="text-align:center;margin-bottom:10px">N° ${pos} dans ta PAL</div><button class="btn accent block" id="d-start">📖 Commencer la lecture</button>`;
  } else if (b.status === 'wish') {
    main = `<div class="card"><div class="field" style="margin-bottom:8px"><label>Date de sortie (facultatif)</label><input id="d-release" type="date" value="${esc(b.releaseDate || '')}"></div>
      <div class="muted small" id="d-rel-lbl">${releaseLabel(b)}</div></div>
      <button class="btn accent block" style="margin-top:12px" id="d-got">🛒 Je l’ai ! → dans ma PAL</button>`;
  } else {
    main = `<div class="card" style="text-align:center"><div class="muted small" style="font-weight:600">Ta note</div>
      <div class="rate" id="d-rate">${[1, 2, 3, 4, 5].map(n => `<button data-r="${n}" class="${n <= (b.rating || 0) ? 'on' : ''}">★</button>`).join('')}</div>
      ${b.finishedAt ? `<div class="muted small">Terminé le ${fmtDate(b.finishedAt, { day: 'numeric', month: 'long', year: 'numeric' })}</div>` : ''}</div>`;
  }
  const sh = openSheet('', `
    <div class="detail-top">${coverHTML(b, 'c-lg')}<div style="min-width:0"><h2>${esc(b.title)}</h2><div class="muted" style="margin-top:6px">${esc(b.author || 'Auteur inconnu')}</div>
      ${b.isbn ? `<div class="muted small" style="margin-top:4px">ISBN ${esc(b.isbn)}</div>` : ''}</div></div>
    <div class="chips">${chips}</div>
    <div class="pills">${[['wish', '💫 Wish'], ['toread', '🫧 PAL'], ['reading', '📖 En cours'], ['read', '🏁 Lu']].map(([k, l]) => `<button data-st="${k}" class="${b.status === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${main}
    ${b.description ? `<div class="section"><div class="section-h"><h2>Résumé</h2></div><div class="desc" id="d-desc">${esc(b.description.replace(/<[^>]+>/g, ''))}</div><button class="link" id="d-more" style="margin-top:6px">Lire plus</button></div>` : ''}
    <div class="section"><div class="section-h"><h2>Mes notes</h2></div><div class="field" style="margin:0"><textarea id="d-notes" rows="3" placeholder="Citations, impressions, personnages…">${esc(b.notes || '')}</textarea></div></div>
    ${logs.length ? `<div class="section"><div class="section-h"><h2>Historique</h2><span class="muted small">${logs.length} entrée${logs.length > 1 ? 's' : ''}</span></div><div class="card">${logs.slice(0, 30).map(l => histRow(l)).join('')}</div></div>` : ''}
    <button class="btn block" style="margin-top:24px" id="d-edition">🔄 Changer d’édition</button>
    <div class="row" style="margin-top:10px;gap:10px"><button class="btn" style="flex:1" id="d-edit">✎ Modifier la fiche</button><button class="btn danger" style="flex:1" id="d-del">Supprimer</button></div>`);
  sh.querySelector('.sh').style.padding = '0 18px';
  bindView(sh);
  sh.querySelectorAll('[data-st]').forEach(p => p.onclick = () => { setStatus(b, p.dataset.st); closeSheet(); setTimeout(() => openBook(id), 150); });
  sh.querySelector('#d-release')?.addEventListener('change', e => { b.releaseDate = e.target.value; save(); render(); sh.querySelector('#d-rel-lbl').textContent = releaseLabel(b); });
  sh.querySelector('#d-got')?.addEventListener('click', () => { setStatus(b, 'toread'); closeSheet(); toast('Ajouté à ta PAL 🫧'); setTimeout(() => openBook(id), 150); });
  sh.querySelector('#d-start')?.addEventListener('click', () => { setStatus(b, 'reading'); closeSheet(); setTimeout(() => openBook(id), 150); });
  sh.querySelectorAll('#d-rate [data-r]').forEach(s => s.onclick = () => {
    b.rating = +s.dataset.r; save(); render(); sh.querySelectorAll('#d-rate [data-r]').forEach(x => x.classList.toggle('on', +x.dataset.r <= b.rating));
  });
  sh.querySelector('#d-more')?.addEventListener('click', e => { sh.querySelector('#d-desc').classList.toggle('open'); e.target.textContent = sh.querySelector('#d-desc').classList.contains('open') ? 'Réduire' : 'Lire plus'; });
  sh.querySelector('#d-notes').onchange = e => { b.notes = e.target.value; save(); toast('Note enregistrée'); };
  sh.querySelector('#d-edit').onclick = () => openEdit(id);
  sh.querySelector('#d-edition').onclick = () => openAdd(id);
  sh.querySelector('#d-del').onclick = () => {
    const c = openSheet('Supprimer ce livre ?', `<p class="muted" style="margin-top:0">« ${esc(b.title)} » et son historique de lecture seront supprimés.</p>
      <button class="btn block" style="background:var(--danger);color:#fff" id="c-yes">Supprimer</button><button class="btn block" style="margin-top:10px" id="c-no">Annuler</button>`);
    c.querySelector('#c-no').onclick = closeSheet;
    c.querySelector('#c-yes').onclick = () => { S.books = S.books.filter(x => x.id !== id); S.logs = S.logs.filter(l => l.bookId !== id); save(); closeAll(); render(); toast('Livre supprimé'); };
  };
}
function setStatus(b, st) {
  if (b.status === st) return;
  b.status = st;
  if (st === 'reading' && !b.startedAt) b.startedAt = Date.now();
  if (st === 'read') { finishBook(b, true); return; }
  if (st === 'toread') { b.finishedAt = null; b.palOrder = palNext(); }
  if (st === 'wish') { b.finishedAt = null; }
  if (st === 'reading') b.finishedAt = null;
  save(); render();
}
function finishBook(b, silent) {
  b.status = 'read'; b.finishedAt = Date.now(); if (b.pages) b.currentPage = b.pages;
  S.logs.push({ id: uid(), bookId: b.id, type: 'finish', date: dayKey(), at: Date.now(), pages: 0, seconds: 0 });
  save(); render(); bubbles(); toast('Livre terminé ! Bravo 🎉');
}

/* ---------- Progression ---------- */
function logProgress(b, newPage, seconds, type) {
  newPage = Math.max(0, Math.round(newPage));
  if (b.pages) newPage = Math.min(newPage, b.pages);
  const delta = Math.max(0, newPage - (b.currentPage || 0));
  b.currentPage = newPage; b.lastReadAt = Date.now();
  if (b.status === 'toread' || b.status === 'wish') { b.status = 'reading'; b.startedAt ||= Date.now(); }
  if (delta || seconds) S.logs.push({ id: uid(), bookId: b.id, type, date: dayKey(), at: Date.now(), pages: delta, seconds: Math.round(seconds || 0) });
  save();
  if (b.pages && newPage >= b.pages && b.status !== 'read') finishBook(b);
  else { render(); toast(delta ? `+${delta} page${delta > 1 ? 's' : ''} 📖` : 'Session enregistrée'); }
  const today = dayTotals()[dayKey()]?.pages || 0, goal = +S.settings.dailyGoal;
  if (delta && today >= goal && today - delta < goal) setTimeout(() => { bubbles(); toast('Objectif du jour atteint ! 🌟'); }, 900);
}
function openProgress(id, seconds) {
  const b = book(id); if (!b) return;
  const cur = b.currentPage || 0;
  const sh = openSheet(seconds != null ? 'Fin de session' : 'Où en es-tu ?', `
    ${seconds != null ? `<div class="card row" style="margin-bottom:16px"><div style="font-size:26px">⏱</div><div><div style="font-weight:700">${fmtDur(seconds)} de lecture</div><div class="muted small">${esc(b.title)}</div></div></div>` : `<p class="muted" style="margin-top:0">${esc(b.title)}</p>`}
    <div class="field"><label>Page atteinte ${b.pages ? `(sur ${b.pages})` : ''}</label>
      <input id="p-page" type="number" inputmode="numeric" value="${cur}" min="0" ${b.pages ? `max="${b.pages}"` : ''} style="font-size:24px;font-weight:700;text-align:center"></div>
    <div class="row" style="gap:8px;margin-bottom:16px">${[5, 10, 20, 50].map(n => `<button class="btn sm" style="flex:1" data-add="${n}">+${n}</button>`).join('')}</div>
    <button class="btn primary block" id="p-save">Enregistrer</button>
    ${b.pages ? `<button class="btn block" style="margin-top:10px" id="p-done">🏁 J’ai terminé ce livre</button>` : ''}`);
  const inp = sh.querySelector('#p-page');
  sh.querySelectorAll('[data-add]').forEach(x => x.onclick = () => { inp.value = Math.min(b.pages || 1e6, (+inp.value || 0) + +x.dataset.add); });
  sh.querySelector('#p-save').onclick = () => { closeSheet(); logProgress(b, +inp.value || 0, seconds, seconds != null ? 'session' : 'update'); };
  sh.querySelector('#p-done')?.addEventListener('click', () => { closeSheet(); closeAll(); logProgress(b, b.pages, seconds, seconds != null ? 'session' : 'update'); });
  setTimeout(() => { inp.focus(); inp.select(); }, 350);
}

/* ---------- Sessions chronométrées ---------- */
const sesEl = document.getElementById('session');
let sesTick;
function sesElapsed() { const s = S.session; if (!s) return 0; return s.acc + (s.runningSince ? (Date.now() - s.runningSince) / 1000 : 0); }
function startSession(id) {
  const b = book(id); if (!b) return;
  if (b.status !== 'reading') setStatus(b, 'reading');
  closeAll();
  S.session = { bookId: id, acc: 0, runningSince: Date.now() }; save();
  showSession();
}
function showSession() {
  const b = book(S.session.bookId); if (!b) { S.session = null; save(); return; }
  document.getElementById('ses-title').textContent = b.title;
  sesEl.classList.add('show');
  try { window.KiriaAndroid?.keepAwake?.(true); } catch (e) { }
  const upd = () => {
    const t = Math.floor(sesElapsed()), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    document.getElementById('ses-timer').textContent = (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
    document.getElementById('ses-pause').textContent = S.session.runningSince ? '❚❚' : '▶';
    document.getElementById('ses-hint').textContent = S.session.runningSince ? 'Bonne lecture dans ta bulle ✨' : 'En pause';
  };
  upd(); clearInterval(sesTick); sesTick = setInterval(upd, 500);
}
document.getElementById('ses-pause').onclick = () => {
  const s = S.session; if (!s) return;
  if (s.runningSince) { s.acc += (Date.now() - s.runningSince) / 1000; s.runningSince = null; } else s.runningSince = Date.now();
  save();
};
document.getElementById('ses-stop').onclick = endSession;
function endSession() {
  const secs = sesElapsed(), id = S.session.bookId;
  clearInterval(sesTick); S.session = null; save();
  sesEl.classList.remove('show');
  try { window.KiriaAndroid?.keepAwake?.(false); } catch (e) { }
  setTimeout(() => openProgress(id, secs), 250);
}

/* ---------- Bouton retour Android ---------- */
window.kiriaBack = function () {
  if (stack.length) { closeSheet(); return true; }
  if (S.session) { toast('Appuie sur ■ pour terminer la session'); return true; }
  if (tab !== 'home') { go('home'); return true; }
  return false;
};

render();
if (S.session) showSession();
</script>
</body>
</html>
