<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>La Bulle de Kiria</title>
<style>
:root{
  --bg:#FBF7FF; --surface:#FFFFFF; --surface-2:#F4EEFC; --ink:#2B2240; --muted:#7D7396; --line:#ECE4F7;
  --primary:#8B5CF6; --primary-ink:#FFFFFF; --primary-soft:#EDE5FE; --accent:#EC4899; --accent-soft:#FCE7F3;
  --ok:#10B981; --warn:#F59E0B; --danger:#E11D48;
  --g1:#C4B5FD; --g2:#F9A8D4; --g3:#A5F3FC;
  --shadow:0 6px 24px rgba(91,52,160,.10); --radius:22px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14101E; --surface:#201933; --surface-2:#2A2142; --ink:#F2EDFB; --muted:#A79DC2; --line:#33294D;
    --primary:#A78BFA; --primary-ink:#1A1329; --primary-soft:#33275A; --accent:#F472B6; --accent-soft:#4A2140;
    --g1:#6D4FC4; --g2:#9D3E78; --g3:#2D6F7E; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
img{display:block}
#view{padding:0 16px calc(96px + env(safe-area-inset-bottom));min-height:100%}
h1,h2,h3{margin:0}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Header bubbles */
.hero{position:relative;margin:0 -16px 8px;padding:28px 20px 22px;overflow:hidden;border-radius:0 0 32px 32px;
  background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft))}
.hero .b{position:absolute;border-radius:50%;opacity:.55;filter:blur(1px);animation:float 9s ease-in-out infinite}
.hero .b1{width:120px;height:120px;right:-30px;top:-30px;background:radial-gradient(circle at 30% 30%,#fff8,var(--g1))}
.hero .b2{width:60px;height:60px;right:70px;top:50px;background:radial-gradient(circle at 30% 30%,#fff8,var(--g2));animation-delay:-3s}
.hero .b3{width:34px;height:34px;left:58%;bottom:12px;background:radial-gradient(circle at 30% 30%,#fff8,var(--g3));animation-delay:-6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{font-family:var(--serif);font-size:27px;font-weight:700;letter-spacing:-.3px}
.hero .date{color:var(--muted);font-size:14px;margin-top:4px;text-transform:capitalize}
.brand{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--primary);margin-bottom:6px}

.goal{position:relative;display:flex;align-items:center;gap:16px;margin-top:18px;background:var(--surface);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.goal .txt b{font-size:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.chip.p{background:var(--primary-soft);color:var(--primary)}
.chip.a{background:var(--accent-soft);color:var(--accent)}

.section{margin-top:24px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.section-h h2{font-size:19px;font-family:var(--serif)}
.link{color:var(--primary);font-weight:600;font-size:14px}

/* cards */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.reading-card{display:flex;gap:14px;margin-bottom:12px}
.reading-card .info{flex:1;min-width:0;display:flex;flex-direction:column}
.title{font-weight:700;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.author{color:var(--muted);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:14px;font-weight:650;font-size:14px;background:var(--surface-2);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.accent{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.btn.danger{background:transparent;color:var(--danger)}
.btn.block{width:100%;padding:14px}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:12px}

/* covers */
.cover{flex:none;border-radius:10px;overflow:hidden;background:var(--surface-2);box-shadow:0 4px 12px rgba(0,0,0,.12);position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:8px;color:#fff;font-family:var(--serif);font-weight:700;font-size:12px;line-height:1.15;text-shadow:0 1px 2px #0004}
.c-sm{width:64px;height:96px}
.c-md{width:78px;height:116px}
.c-lg{width:130px;height:196px;border-radius:14px}

.hscroll{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{width:96px;flex:none}
.mini .cover{width:96px;height:144px}
.mini .t{font-size:13px;font-weight:650;margin-top:8px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* library */
.page-h{padding:24px 0 12px;display:flex;align-items:center;justify-content:space-between}
.page-h h1{font-family:var(--serif);font-size:28px}
.seg{display:flex;background:var(--surface-2);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 2px;border-radius:12px;font-weight:650;font-size:12.5px;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.seg .n{font-size:11.5px;opacity:.8;margin-left:3px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 14px;margin:12px 0}
.search input{flex:1;border:0;background:none;padding:13px 0;outline:none;font-size:15px}
.search:focus-within{border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:18px 14px}
.gitem .cover{width:100%;aspect-ratio:2/3;height:auto}
.gitem .t{font-size:13px;font-weight:650;margin-top:8px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gitem .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitem .bar{height:5px;margin-top:6px}
.stars{color:#F5B301;font-size:12px;letter-spacing:1px}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .bubble{width:92px;height:92px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;
  background:radial-gradient(circle at 30% 30%,#fff9,var(--g1) 60%,var(--g2))}
.empty h3{color:var(--ink);font-family:var(--serif);font-size:20px;margin-bottom:6px}

/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:24px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .ic{font-size:18px}
.chart-card{margin-top:14px}
.chart-card h3{font-size:15px;margin-bottom:2px}
svg text{fill:var(--muted);font-family:var(--font)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:1fr;gap:4px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2)}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:8px;font-size:11px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* tab bar */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;background:var(--surface);border-radius:26px;box-shadow:0 10px 30px rgba(60,30,110,.18);padding:6px;z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:11px;font-weight:650;color:var(--muted);border-radius:18px}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--primary)}
.tabbar .fab{flex:none;width:54px;height:54px;margin:-26px 6px 0;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;box-shadow:0 8px 20px rgba(139,92,246,.45);justify-content:center}
.tabbar .fab svg{width:28px;height:28px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,10,40,.45);z-index:40;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--bg);border-radius:28px 28px 0 0;z-index:41;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 4px;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;flex:none}
.sheet .sh h2{font-family:var(--serif);font-size:21px}
.sheet .sb{overflow-y:auto;padding:4px 18px 24px;-webkit-overflow-scrolling:touch}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:18px}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;outline:none;font-size:15px}
.field input:focus,.field textarea:focus{border-color:var(--primary)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.result{display:flex;gap:12px;align-items:center;cursor:pointer;padding:10px;border-radius:16px;background:var(--surface);margin-bottom:10px}
.result .info{flex:1;min-width:0}
.result .add{width:40px;height:40px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:22px;font-weight:700;flex:none}
.result .add.done{background:var(--ok);color:#fff;font-size:16px}

.detail-top{display:flex;gap:16px;align-items:flex-end;margin-bottom:16px}
.detail-top h2{font-family:var(--serif);font-size:22px;line-height:1.2}
.pills{display:flex;gap:6px;margin:14px 0}
.pills button{flex:1;padding:10px 2px;white-space:nowrap;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-weight:650;font-size:13px}
.pills button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.desc{font-size:14.5px;line-height:1.55;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.desc.open{-webkit-line-clamp:unset;display:block}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist:last-child{border:0}
.hist>.cover{width:40px;height:60px;border-radius:6px}
.stack{position:relative;flex:none}
.stack>div{position:absolute;top:0;width:44px;height:100%;}
.stack>div .cover{width:100%;height:100%;border-radius:7px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.shelf-card{width:136px;flex:none;background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow);cursor:pointer}
.shelf-card .stack>div{width:40px}
.shelf-card .t{font-size:13.5px;font-weight:700;margin-top:10px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shelfchips{margin:10px -16px 0;padding-bottom:2px}
.shelfchips .chip{flex:none;padding:8px 12px;font-size:13px;white-space:nowrap}
.shelfchips .chip.on{box-shadow:inset 0 0 0 1.5px var(--primary)}
.chip .n{opacity:.7;font-size:11px}
.emo{display:flex;flex-wrap:wrap;gap:8px}
.emo button{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:20px}
.emo button.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.chead div{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);padding-bottom:4px}
.cday{position:relative;aspect-ratio:.68;border-radius:9px;background:var(--surface-2);overflow:hidden;padding:0}
.cday.empty{background:none}
.cday .cnum{position:absolute;top:3px;left:5px;font-size:11.5px;font-weight:700;color:var(--muted);z-index:3}
.cday.has .cnum{color:#fff;text-shadow:0 1px 3px #000a;background:#0005;border-radius:6px;padding:0 4px;left:3px}
.cday.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cday.sel{box-shadow:0 0 0 2.5px var(--primary)}
.cday .ccov{position:absolute;inset:0}
.cday .ccov .cover{width:100%;height:100%;border-radius:0;box-shadow:none}
.cday .ccov .ph{font-size:8px;padding:4px}
.cday .cmore{position:absolute;bottom:3px;right:3px;z-index:3;background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px}
.fbadge{position:absolute;right:3px;bottom:3px;z-index:2;font-size:11px;background:#000a;border-radius:6px;padding:1px 3px;line-height:1.2}
.mini.rel{position:relative}
.jbadge{position:absolute;top:6px;left:6px;z-index:3;background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:8px;padding:2px 6px}
.sbadge{position:absolute;top:6px;right:6px;z-index:3;background:#000a;color:#FCD34D;font-size:12px;border-radius:8px;padding:1px 5px}
.radar-bar{display:flex;align-items:center;gap:12px;padding:12px 14px}
.radar-hint{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;font-size:14px;padding:12px 14px;color:var(--ink)}
.pin{width:32px;height:32px;border-radius:50%;background:var(--surface-2);font-size:17px;color:var(--muted)}
.pin.on{background:#FEF3C7;color:#D97706}
.cday.rad{box-shadow:inset 0 0 0 2px #F59E0B}
.cday.rad.sel{box-shadow:0 0 0 2.5px var(--primary)}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:3px}
.lg-b{background:var(--primary)}
.lg-r{background:none;box-shadow:inset 0 0 0 2px #F59E0B}
.filt .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.hb{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13.5px}
.hb-l{width:118px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-t{flex:1;height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--primary),var(--accent))}
.hb-v{width:34px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.kpis .kpi .v{font-size:21px}
.mhead{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--primary);padding:12px 0 2px}
.mhead:first-child{padding-top:2px}
.hist .dot{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.rate button{font-size:30px;color:var(--line);padding:0 2px}
.rate button.on{color:#F5B301}

/* session */
.session{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;
  background:linear-gradient(160deg,#5B3BB5,#8B5CF6 45%,#EC4899);transform:translateY(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s}
.session.show{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.session .sb1,.session .sb2,.session .sb3{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffffff55,#ffffff10);animation:float 7s ease-in-out infinite}
.session .sb1{width:180px;height:180px;left:-50px;top:10%}
.session .sb2{width:90px;height:90px;right:20px;top:22%;animation-delay:-2s}
.session .sb3{width:130px;height:130px;right:-30px;bottom:12%;animation-delay:-4s}
.session .lbl{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8;font-weight:700}
.session .bt{font-family:var(--serif);font-size:22px;font-weight:700;margin:8px 0 30px;max-width:320px;position:relative}
.timer{font-size:72px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-2px;position:relative}
.session .ctrls{display:flex;gap:16px;margin-top:40px;position:relative}
.session .ctrls button{width:72px;height:72px;border-radius:50%;background:#ffffff2e;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.session .ctrls button.stop{background:#fff;color:#8B5CF6}
.session .hint{margin-top:16px;font-size:13px;opacity:.8;position:relative}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:28px;height:28px;border:3px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:sp 0.8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.pop{position:fixed;border-radius:50%;pointer-events:none;z-index:95;animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{transform:translateY(0) scale(.4);opacity:1}100%{transform:translateY(-70vh) scale(1.1);opacity:0}}
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6.5A2.5 2.5 0 0 0 4 20.5 2.5 2.5 0 0 0 6.5 23H19"/><path d="M8 7h7"/></svg>Biblio</button>
  <button class="fab" id="fab" aria-label="Ajouter un livre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Moi</button>
</nav>

<div id="sheets"></div>

<div class="session" id="session">
  <div class="sb1"></div><div class="sb2"></div><div class="sb3"></div>
  <div class="lbl">Session de lecture</div>
  <div class="bt" id="ses-title"></div>
  <div class="timer" id="ses-timer">00:00</div>
  <div class="ctrls">
    <button id="ses-pause" aria-label="Pause">❚❚</button>
    <button class="stop" id="ses-stop" aria-label="Terminer">■</button>
  </div>
  <div class="hint" id="ses-hint">Bonne lecture dans ta bulle ✨</div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ---------- Données ---------- */
const KEY = 'kiria.v1';
const DEFAULT = { books: [], logs: [], settings: { name: 'Kiria', dailyGoal: 20, frOnly: false }, session: null };
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || structuredClone(DEFAULT); } catch (e) { S = structuredClone(DEFAULT); }
S.settings = Object.assign({}, DEFAULT.settings, S.settings || {});
S.books = S.books || []; S.logs = S.logs || []; S.shelves = S.shelves || []; S.radar = S.radar || {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Impossible d’enregistrer'); } scheduleAutoBackup(); }

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const dayKey = (d = new Date()) => { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const book = id => S.books.find(b => b.id === id);
const pct = b => b.pages ? Math.min(100, Math.round((b.currentPage || 0) / b.pages * 100)) : (b.status === 'read' ? 100 : 0);
function fmtDur(sec, short) {
  sec = Math.round(sec || 0); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  if (h) return h + ' h' + (m ? ' ' + String(m).padStart(2, '0') : '');
  if (m) return m + ' min';
  return short ? '0 min' : sec + ' s';
}
const fmtDate = (d, o = { day: 'numeric', month: 'short' }) => new Date(d).toLocaleDateString('fr-FR', o);
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
function bubbles() {
  const cols = ['#C4B5FD', '#F9A8D4', '#A5F3FC', '#FDE68A', '#8B5CF6'];
  for (let i = 0; i < 18; i++) {
    const e = document.createElement('div'); const s = 12 + Math.random() * 30;
    e.className = 'pop'; e.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}vw;bottom:${-20 + Math.random() * 60}px;animation-delay:${Math.random() * .5}s;background:radial-gradient(circle at 30% 30%,#fffb,${cols[i % 5]})`;
    document.body.appendChild(e); setTimeout(() => e.remove(), 2400);
  }
}


/* ---------- Réseau (via Android quand disponible : pas de blocage CORS) ---------- */
const pendingHttp = {};
window.__kiriaHttp = (id, code, body, err) => {
  const p = pendingHttp[id]; if (!p) return; delete pendingHttp[id];
  (code >= 200 && code < 300 && body != null) ? p.res(body) : p.rej(new Error(code ? 'HTTP ' + code : (err || 'réseau')));
};
function nativeGet(url, signal) {
  return new Promise((res, rej) => {
    const id = uid(); pendingHttp[id] = { res, rej };
    signal && signal.addEventListener('abort', () => { if (pendingHttp[id]) { delete pendingHttp[id]; rej(new DOMException('Annulé', 'AbortError')); } });
    setTimeout(() => { if (pendingHttp[id]) { delete pendingHttp[id]; rej(new Error('délai dépassé')); } }, 25000);
    KiriaAndroid.httpGet(id, url);
  });
}
async function httpText(url, signal) {
  let first;
  if (window.KiriaAndroid && typeof KiriaAndroid.httpGet === 'function') {
    try { return await nativeGet(url, signal); } catch (e) { if (e.name === 'AbortError') throw e; first = e; }
  }
  try {
    const r = await fetch(url, { signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.text();
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    throw new Error((first ? 'natif: ' + first.message + ' / ' : '') + 'web: ' + e.message);
  }
}
const searchInfo = {};

/* ---------- Catalogue BnF (toutes les éditions publiées en France) ---------- */
const DC = 'http://purl.org/dc/elements/1.1/';
function bnfParse(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const recs = [...doc.getElementsByTagNameNS('*', 'dc')];
  return recs.map(r => {
    const all = n => [...r.getElementsByTagNameNS(DC, n)].map(e => e.textContent.trim());
    const one = n => all(n)[0] || '';
    let title = one('title').split(' / ')[0].replace(/\[[^\]]*\]/g, '').replace(/\s+:\s+roman$/i, '').trim();
    const author = all('creator').map(c => {
      c = c.split(/\.\s/)[0].replace(/\([^)]*\)/g, '').trim().replace(/\.$/, '');
      const [last, first] = c.split(',').map(x => x && x.trim());
      return first ? first + ' ' + last : last;
    }).filter(Boolean).join(', ');
    const fmt = all('format').join(' ');
    const pages = +((fmt.match(/(\d+)\s*p\./) || [])[1] || 0);
    const isbn = ((all('identifier').find(x => /ISBN/i.test(x)) || '').match(/[\dXx-]{10,17}/) || [''])[0].replace(/-/g, '');
    const ark = ((all('identifier').find(x => /ark:/.test(x)) || '').match(/ark:\/12148\/\w+/) || [''])[0];
    const publisher = (one('publisher').split(' : ')[0] || '').replace(/\s*\([^)]*\)\s*/g, ' ').trim();
    const year = (one('date').match(/\d{4}/) || [''])[0];
    const lang = all('language').some(l => /^fre|^fra|fran/i.test(l)) ? 'fr' : (all('language').some(l => /^eng|angl/i.test(l)) ? 'en' : '');
    const type = all('type').join(' ').toLowerCase();
    return { key: ark || isbn || title, title, author, pages, isbn, publisher, year, lang, description: '', source: 'BnF', type,
      cover: isbn ? `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false` : '',
      cover2: ark ? `https://catalogue.bnf.fr/couverture?&appName=NE&idArk=${ark}&couverture=1` : '' };
  }).filter(b => b.title && !/sonore|vidéo|musique|partition/.test(b.type));
}
/* Cache des réponses BnF (le serveur coupe parfois les connexions trop rapprochées) */
const bnfCache = (() => { try { return JSON.parse(localStorage.getItem('kiria.bnfcache') || '{}'); } catch (e) { return {}; } })();
function bnfCachePut(k, v) {
  bnfCache[k] = { t: Date.now(), v };
  const keys = Object.keys(bnfCache).sort((a, b) => bnfCache[b].t - bnfCache[a].t);
  keys.slice(60).forEach(x => delete bnfCache[x]);
  try { localStorage.setItem('kiria.bnfcache', JSON.stringify(bnfCache)); } catch (e) { }
}
async function bnfSearch(term, isIsbn, signal) {
  const clean = term.replace(/"/g, ' ').trim();
  const key = clean.toLowerCase();
  const c = bnfCache[key];
  if (c && Date.now() - c.t < 7 * 864e5) { searchInfo.bnf = '✓ ' + c.v.length; return c.v; }
  const cql = isIsbn ? `bib.isbn all "${clean.replace(/[-\s]/g, '')}"` : `bib.anywhere all "${clean}"`;
  const url = 'https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&recordSchema=dublincore&maximumRecords=25&query=' + encodeURIComponent(cql);
  let last;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      if (attempt) await new Promise(r => setTimeout(r, 1500 * attempt));
      if (signal && signal.aborted) throw new DOMException('Annulé', 'AbortError');
      const r = bnfParse(await httpText(url, signal));
      searchInfo.bnf = '✓ ' + r.length; bnfCachePut(key, r); return r;
    } catch (e) { if (e.name === 'AbortError') throw e; last = e; }
  }
  searchInfo.bnf = '✗ ' + last.message; throw last;
}

/* ---------- Couvertures ---------- */
const PALETTES = [['#8B5CF6', '#EC4899'], ['#6366F1', '#06B6D4'], ['#F59E0B', '#EF4444'], ['#10B981', '#3B82F6'], ['#A855F7', '#6366F1'], ['#F472B6', '#FB923C']];
function coverHTML(b, cls) {
  const h = [...(b.title || '?')].reduce((a, c) => a + c.charCodeAt(0), 0) % PALETTES.length;
  const [c1, c2] = PALETTES[h];
  const ph = `<div class="ph" style="background:linear-gradient(150deg,${c1},${c2})">${esc((b.title || '').slice(0, 40))}</div>`;
  const src = b.cover || b.cover2;
  const alt = b.cover && b.cover2 ? ` data-alt="${esc(b.cover2)}"` : '';
  const img = src ? `<img src="${esc(src)}"${alt} alt="" loading="lazy" onerror="if(this.dataset.alt){this.src=this.dataset.alt;delete this.dataset.alt}else this.remove()" onload="if(this.naturalWidth<20)this.onerror()" style="position:relative;z-index:1">` : '';
  const fb = b.format === 'audio' ? '🎧' : b.format === 'webtoon' ? '🖼' : b.format === 'ebook' ? '📱' : '';
  return `<div class="cover ${cls}">${ph}${img}${fb ? `<span class="fbadge">${fb}</span>` : ''}</div>`;
}

/* ---------- Formats (papier, ebook, audio, webtoon) ---------- */
const FORMATS = {
  paper: { e: '📕', l: 'Papier', u: 'p', one: 'page', many: 'pages', add: '＋ Pages' },
  ebook: { e: '📱', l: 'Ebook', u: 'p', one: 'page', many: 'pages', add: '＋ Pages' },
  audio: { e: '🎧', l: 'Audio', u: 'min', one: 'minute', many: 'minutes', add: '＋ Écoute' },
  webtoon: { e: '🖼', l: 'Webtoon', u: 'ch', one: 'chapitre', many: 'chapitres', add: '＋ Chapitres' }
};
const fmtOf = b => FORMATS[(b && b.format) || 'paper'] || FORMATS.paper;
const unitOf = b => fmtOf(b).u;
function fmtMin(m) { m = Math.round(m || 0); const h = Math.floor(m / 60), r = m % 60; return h ? `${h} h${r ? ' ' + String(r).padStart(2, '0') : ''}` : `${r} min`; }
/* "12h30", "12:30", "750" (minutes) → minutes */
function parseDur(s) {
  s = String(s || '').trim().toLowerCase().replace(',', '.');
  if (!s) return 0;
  let m = s.match(/^(\d+(?:\.\d+)?)\s*[h:]\s*(\d{1,2})?\s*(?:min|m)?$/);
  if (m) return Math.round(parseFloat(m[1]) * 60 + (m[2] ? +m[2] : 0));
  m = s.match(/^(\d+)\s*(?:min|m)?$/);
  return m ? +m[1] : 0;
}
/* Progression lisible : "p. 34 / 96", "3 h 20 / 12 h", "Ch. 45 / 120" */
function progLabel(b, long) {
  const f = fmtOf(b), cur = b.currentPage || 0, tot = b.pages || 0;
  if (f.u === 'min') return tot ? `${fmtMin(cur)} / ${fmtMin(tot)}` : fmtMin(cur) + ' écoutées';
  if (f.u === 'ch') return tot ? `Ch. ${cur} / ${tot}` : `Ch. ${cur}${long ? ' (série en cours)' : ''}`;
  return tot ? (long ? `Page ${cur} / ${tot}` : `p. ${cur} / ${tot}`) : (long ? `Page ${cur}` : 'Pages inconnues');
}
function qtyLabel(n, u) {
  if (u === 'min') return fmtMin(n);
  if (u === 'ch') return `${n} chapitre${n > 1 ? 's' : ''}`;
  return `${n} page${n > 1 ? 's' : ''}`;
}

/* ---------- Genres (tags) ---------- */
const BASE_TAGS = [
  { id: 'fantasy', l: 'Fantasy', e: '🐉' },
  { id: 'romantasy', l: 'Romantasy', e: '🧚' },
  { id: 'romance', l: 'Romance', e: '💘' },
  { id: 'darkromance', l: 'Dark romance', e: '🖤' }
];
function allTags() { return BASE_TAGS.concat((S.settings.customTags || []).map(t => ({ id: t.id, l: t.l, e: t.e || '🏷', custom: true }))); }
const tagById = id => allTags().find(t => t.id === id);
const tagChip = id => { const t = tagById(id); return t ? `${t.e} ${esc(t.l)}` : ''; };
const nrm = s => ' ' + (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '') + ' ';
const RX = {
  dark: /dark romance|darkromance|mafia|bratva|captiv|obsess|stalk|kidnap|enlev|possessi|ravisseur|bully|why choose|tabou|cartel|soumi|mon bourreau|psychopath/,
  fantasy: /fantasy|fantastique|\bfae\b|faes|fee |fees |dragon|magie|magique|sorci|royaume|elfe|elfique|prophet|dieux|deesse|vampire|loup-garou|lycan|metamorph|shifter|witch|kingdom|magic|sortilege|chevaucheu|couronne|immortel|demon|ange dechu|mythologi/,
  romance: /romance|romantique|amour|amoureu|\blove\b|passion|sentiment|ennemis? (a|aux) amants|enemies to lovers|slow burn|coup de foudre|seduction|desir|milliardaire|billionaire|mariage arrange|fake dating/
};
function classify(b) {
  const t = nrm([b.title, b.genre, b.description].join(' '));
  const tags = [];
  const fan = RX.fantasy.test(t), rom = RX.romance.test(t), dark = RX.dark.test(t);
  if (/romantasy/.test(t) || (fan && rom)) tags.push('romantasy');
  if (fan) tags.push('fantasy');
  if (dark) tags.push('darkromance');
  if (rom || dark) tags.push('romance');
  for (const c of (S.settings.customTags || [])) if (c.kw && nrm(c.kw).trim() && t.includes(nrm(c.kw).trim())) tags.push(c.id);
  return [...new Set(tags)];
}

/* ---------- PAL & Wishlist ---------- */
const STATUS = { wish: '💫 Wishlist', toread: '🫧 PAL', reading: '📖 En cours', read: '🏁 Lu' };
function palList() { return S.books.filter(b => b.status === 'toread').sort((a, b) => (a.palOrder ?? a.addedAt) - (b.palOrder ?? b.addedAt)); }
function palNext() { return Math.max(0, ...S.books.filter(b => b.status === 'toread').map(b => b.palOrder || 0)) + 1; }
function movePal(id, dir, visibleIds) {
  const all = palList(); all.forEach((b, i) => b.palOrder = i + 1);
  const l = visibleIds ? all.filter(b => visibleIds.includes(b.id)) : all;
  const i = l.findIndex(b => b.id === id), j = i + dir; if (i < 0 || j < 0 || j >= l.length) return;
  [l[i].palOrder, l[j].palOrder] = [l[j].palOrder, l[i].palOrder]; save(); render();
}
function daysUntil(d) { if (!d) return null; const t = new Date(d + 'T00:00:00'); const n = new Date(); n.setHours(0, 0, 0, 0); return Math.round((t - n) / 864e5); }
function releaseLabel(b) {
  const n = daysUntil(b.releaseDate); if (n === null) return 'Date de sortie inconnue';
  if (n > 1) return `Sort dans ${n} jours · ${fmtDate(b.releaseDate + 'T00:00:00', { day: 'numeric', month: 'long', year: 'numeric' })}`;
  if (n === 1) return 'Sort demain !'; if (n === 0) return 'Sort aujourd’hui ! 🎉';
  return 'Déjà disponible depuis le ' + fmtDate(b.releaseDate + 'T00:00:00', { day: 'numeric', month: 'long', year: 'numeric' });
}

/* ---------- Piles personnalisées (mood, challenge…) ---------- */
const SHELF_EMOJIS = ['🌧', '☀️', '🍂', '❄️', '💘', '🔥', '🐉', '🔪', '👻', '🧚', '🏆', '🎯', '📅', '🌙', '☕', '🌸'];
const SHELF_COLORS = [['#8B5CF6', '#EC4899'], ['#6366F1', '#06B6D4'], ['#F59E0B', '#EF4444'], ['#10B981', '#3B82F6'], ['#F472B6', '#FB923C'], ['#0EA5E9', '#A855F7']];
function shelf(id) { return S.shelves.find(s => s.id === id); }
function shelfBooks(sh) { return (sh.books || []).map(book).filter(Boolean); }
function shelvesOf(bookId) { return S.shelves.filter(s => (s.books || []).includes(bookId)); }
function toggleInShelf(sh, bookId) {
  sh.books = sh.books || [];
  const i = sh.books.indexOf(bookId);
  if (i >= 0) sh.books.splice(i, 1); else sh.books.push(bookId);
  save();
  return i < 0;
}
function shelfProgress(sh) {
  const l = shelfBooks(sh), done = l.filter(b => b.status === 'read').length;
  const target = +sh.target || l.length;
  return { done, total: l.length, target, pct: target ? Math.min(100, Math.round(done / target * 100)) : 0 };
}
function shelfStack(sh, size = 44) {
  const l = shelfBooks(sh).slice(0, 3);
  const [c1, c2] = SHELF_COLORS[sh.color || 0];
  if (!l.length) return `<div class="stack" style="width:${size}px;height:${size * 1.5}px;background:linear-gradient(150deg,${c1},${c2});border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:${size / 2}px">${sh.emoji}</div>`;
  return `<div class="stack" style="width:${size + (l.length - 1) * 12}px;height:${size * 1.5}px">${l.map((b, i) => `<div style="left:${i * 12}px;z-index:${3 - i}">${coverHTML(b, '')}</div>`).join('')}</div>`;
}
function openShelfEditor(id, afterCreate) {
  const sh = id ? shelf(id) : { name: '', emoji: '🌧', color: 0, kind: 'mood', target: '', deadline: '', note: '' };
  let emoji = sh.emoji, color = sh.color || 0, kind = sh.kind || 'mood';
  const ui = openSheet(id ? 'Modifier la pile' : 'Nouvelle pile', `
    <div class="pills" style="margin-top:0">${[['mood', '🌧 Pile à mood'], ['challenge', '🏆 Challenge'], ['autre', '📚 Autre']].map(([k, l]) => `<button data-k="${k}" class="${k === kind ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="field"><label>Nom de la pile *</label><input id="s-name" maxlength="40" placeholder="Ex. : Lectures cocooning, Cold Winter Challenge…" value="${esc(sh.name)}"></div>
    <div class="field"><label>Emoji</label><div class="emo">${SHELF_EMOJIS.map(e => `<button data-e="${e}" class="${e === emoji ? 'on' : ''}">${e}</button>`).join('')}</div></div>
    <div class="field"><label>Couleur</label><div class="emo">${SHELF_COLORS.map((c, i) => `<button data-c="${i}" class="${i === color ? 'on' : ''}" style="background:linear-gradient(135deg,${c[0]},${c[1]})"></button>`).join('')}</div></div>
    <div id="s-ch" style="display:${kind === 'challenge' ? 'block' : 'none'}">
      <div class="two"><div class="field"><label>Objectif (nb de livres)</label><input id="s-target" type="number" inputmode="numeric" min="1" value="${esc(sh.target || '')}"></div>
      <div class="field"><label>Date de fin</label><input id="s-deadline" type="date" value="${esc(sh.deadline || '')}"></div></div>
    </div>
    <div class="field"><label>Description / règles (facultatif)</label><textarea id="s-note" rows="3" placeholder="Ex. : 1 livre avec une couverture bleue, 1 romantasy, 1 livre de moins de 300 pages…">${esc(sh.note || '')}</textarea></div>
    <button class="btn primary block" id="s-save">${id ? 'Enregistrer' : 'Créer la pile'}</button>
    ${id ? '<button class="btn danger block" style="margin-top:10px" id="s-del">Supprimer la pile</button>' : ''}`);
  ui.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { kind = b.dataset.k; ui.querySelectorAll('[data-k]').forEach(x => x.classList.toggle('on', x === b)); ui.querySelector('#s-ch').style.display = kind === 'challenge' ? 'block' : 'none';
    if (!ui.querySelector('#s-name').value) { emoji = kind === 'challenge' ? '🏆' : kind === 'mood' ? '🌧' : '📚'; ui.querySelectorAll('[data-e]').forEach(x => x.classList.toggle('on', x.dataset.e === emoji)); } });
  ui.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { emoji = b.dataset.e; ui.querySelectorAll('[data-e]').forEach(x => x.classList.toggle('on', x === b)); });
  ui.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { color = +b.dataset.c; ui.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('on', x === b)); });
  ui.querySelector('#s-save').onclick = () => {
    const name = ui.querySelector('#s-name').value.trim(); if (!name) { toast('Donne un nom à ta pile'); return; }
    const data = { name, emoji, color, kind, note: ui.querySelector('#s-note').value.trim(),
      target: kind === 'challenge' ? Math.max(0, parseInt(ui.querySelector('#s-target').value) || 0) || '' : '',
      deadline: kind === 'challenge' ? ui.querySelector('#s-deadline').value : '' };
    if (id) Object.assign(sh, data);
    else { const n = Object.assign({ id: uid(), books: [], createdAt: Date.now() }, data); S.shelves.push(n); id = n.id; }
    save(); closeSheet(); render();
    toast(afterCreate ? 'Pile créée ✓' : 'Pile enregistrée ✓');
    afterCreate ? afterCreate(id) : (libFilter = 'shelf:' + id, go('library'));
  };
  ui.querySelector('#s-del')?.addEventListener('click', () => {
    const c = openSheet('Supprimer cette pile ?', `<p class="muted" style="margin-top:0">La pile « ${esc(sh.name)} » sera supprimée. Les livres restent dans ta bibliothèque.</p>
      <button class="btn block" style="background:var(--danger);color:#fff" id="c-yes">Supprimer</button><button class="btn block" style="margin-top:10px" id="c-no">Annuler</button>`);
    c.querySelector('#c-no').onclick = closeSheet;
    c.querySelector('#c-yes').onclick = () => { S.shelves = S.shelves.filter(x => x.id !== sh.id); save(); closeAll(); libFilter = 'toread'; render(); toast('Pile supprimée'); };
  });
}
function openShelfPicker(shId) {
  const sh = shelf(shId);
  const order = { toread: 0, wish: 1, reading: 2, read: 3 };
  const all = [...S.books].sort((a, b) => (order[a.status] - order[b.status]) || a.title.localeCompare(b.title));
  const ui = openSheet(`${sh.emoji} Ajouter à « ${esc(sh.name)} »`, `
    <label class="search" style="margin-top:0"><span class="muted">🔍</span><input id="pk-q" placeholder="Filtrer"></label>
    <div id="pk-list" class="card" style="padding:4px 14px"></div>
    <button class="btn block" style="margin-top:12px" id="pk-new">＋ Chercher un nouveau livre</button>
    <button class="btn primary block" style="margin-top:10px" id="pk-done">Terminé</button>`);
  const list = ui.querySelector('#pk-list');
  const draw = () => {
    const q = ui.querySelector('#pk-q').value.trim().toLowerCase();
    const l = all.filter(b => !q || (b.title + ' ' + b.author).toLowerCase().includes(q));

function bindRadar(root) {

/* ---------- Statistiques ---------- */
function dayTotals() {
  const m = {};
  for (const l of S.logs) { const k = l.date; (m[k] ||= { pages: 0, sec: 0, min: 0, ch: 0 }); const u = l.unit || 'p'; if (u === 'p') m[k].pages += l.pages || 0; else m[k][u] += l.pages || 0; m[k].sec += l.seconds || 0; }
  return m;
}
function streak() {
  const m = dayTotals(); let n = 0; const d = new Date();
  if (!m[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (m[dayKey(d)] && (m[dayKey(d)].pages > 0 || m[dayKey(d)].sec > 0 || m[dayKey(d)].min > 0 || m[dayKey(d)].ch > 0)) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function ring(value, max, size = 64, stroke = 7, label) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = Math.min(1, max ? value / max : 0);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">
    <defs><linearGradient id="rg${size}" x1="0" x2="1"><stop offset="0" stop-color="var(--primary)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="url(#rg${size})" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dashoffset .6s"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" style="fill:var(--ink);font-weight:750;font-size:${size / 4.6}px">${label ?? Math.round(p * 100) + '%'}</text></svg>`;
}

function go(t) { tab = t; render(); window.scrollTo(0, 0); }

document.getElementById('fab').onclick = () => openAdd();

function render() {
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab || (tab === 'agenda' && b.dataset.tab === 'home')));
  const v = document.getElementById('view');
  v.innerHTML = ({ home: viewHome, library: viewLibrary, stats: viewStats, me: viewMe, agenda: viewAgenda })[tab]();
  bindView(v);
}
function bindView(root) {
  root.querySelectorAll('[data-open]').forEach(e => e.onclick = ev => { ev.stopPropagation(); openBook(e.dataset.open); });
  root.querySelectorAll('[data-progress]').forEach(e => e.onclick = ev => { ev.stopPropagation(); openProgress(e.dataset.progress); });
  root.querySelectorAll('[data-session]').forEach(e => e.onclick = ev => { ev.stopPropagation(); startSession(e.dataset.session); });
  root.querySelectorAll('[data-go]').forEach(e => e.onclick = ev => { ev.stopPropagation(); if (e.dataset.filter) libFilter = e.dataset.filter; if (e.dataset.fmt !== undefined) { libFmt = e.dataset.fmt; libTag = ''; } if (e.dataset.go === 'agenda') { calMonth = null; calDay = null; } go(e.dataset.go); });
}

  if (libFilter === 'wish' && !curShelf) h = h.replace('<div class="grid">', '<button class="btn block" style="margin-bottom:14px" data-go="agenda">📅 Voir le calendrier des sorties</button><div class="grid">');
  setTimeout(() => {
    const vis = list.map(b => b.id);
    document.querySelectorAll('[data-mv]').forEach(x => x.onclick = e => { e.stopPropagation(); movePal(x.dataset.id, +x.dataset.mv, vis); });
    const i = document.getElementById('libq'); if (!i) return;
    i.oninput = () => { libQuery = i.value; const pos = i.selectionStart; render(); const n = document.getElementById('libq'); n.focus(); n.setSelectionRange(pos, pos); };
  });
  return h;
}

/* ---------- Statistiques ---------- */
let statsPeriod = 'year';
function barChart(vals, labels, opts = {}) {
  const W = 340, H = opts.h || 150, pb = 22, n = vals.length, bw = W / n;
  const max = Math.max(opts.goal || 0, ...vals, opts.min || 10);
  let s = '';
  vals.forEach((v, i) => {
    const bh = v / max * (H - pb - 14); const x = i * bw + bw * .18, w = bw * .64;
    s += `<rect x="${x}" y="${H - pb - bh}" width="${w}" height="${Math.max(bh, v ? 3 : 0)}" rx="${Math.min(8, w / 2.6)}" fill="${opts.color || 'url(#bg)'}"/>`;
    if (opts.values && v) s += `<text x="${x + w / 2}" y="${H - pb - bh - 4}" text-anchor="middle" font-size="10.5" style="fill:var(--ink);font-weight:700">${opts.fmt ? opts.fmt(v) : v}</text>`;
    if (labels[i]) s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" font-size="10">${labels[i]}</text>`;
  });
  const gy = opts.goal ? H - pb - opts.goal / max * (H - pb - 14) : 0;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:10px"><defs><linearGradient id="bg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--primary)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${H - pb}" y2="${H - pb}" stroke="var(--line)"/>
    ${opts.goal ? `<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--accent)" stroke-dasharray="4 4" opacity=".6"/><text x="2" y="${gy - 4}" font-size="10">${opts.goalLabel || 'objectif'}</text>` : ''}${s}</svg>`;
}
function hbars(rows) {
  const max = Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `<div class="hb"><div class="hb-l">${r.l}</div><div class="hb-t"><i style="width:${Math.max(4, r.v / max * 100)}%;${r.c ? 'background:' + r.c : ''}"></i></div><div class="hb-v">${r.t ?? r.v}</div></div>`).join('');
}
function viewStats() {
  const year = new Date().getFullYear();
  const since = statsPeriod === 'year' ? new Date(year, 0, 1).getTime() : statsPeriod === 'month' ? new Date(year, new Date().getMonth(), 1).getTime() : 0;
  const logs = S.logs.filter(l => l.at >= since);
  const sum = (u, k = 'pages') => logs.filter(l => (l.unit || 'p') === u).reduce((a, l) => a + (l[k] || 0), 0);
  const pages = sum('p'), minutes = sum('min'), chapters = sum('ch');
  const readSec = logs.filter(l => (l.unit || 'p') !== 'min').reduce((a, l) => a + (l.seconds || 0), 0);
  const read = S.books.filter(b => b.status === 'read' && (b.finishedAt || 0) >= since);
  const allRead = S.books.filter(b => b.status === 'read');
  const yearRead = allRead.filter(b => b.finishedAt && new Date(b.finishedAt).getFullYear() === year).length;
  const goal = +S.settings.yearGoal || 0;
  const m = dayTotals();
  const per = { year: 'Cette année', month: 'Ce mois-ci', all: 'Depuis le début' };
  let h = `<div class="page-h"><h1>Statistiques</h1></div>
  <div class="seg" style="margin-bottom:14px">${Object.keys(per).map(k => `<button class="${k === statsPeriod ? 'on' : ''}" onclick="statsPeriod='${k}';render()">${per[k]}</button>`).join('')}</div>`;
  // Défi de l'année
  h += `<div class="card row" style="gap:16px;margin-bottom:14px">${ring(yearRead, goal || Math.max(yearRead, 1), 78, 8, goal ? undefined : String(yearRead))}
    <div style="flex:1"><div class="muted small" style="font-weight:650">Défi lecture ${year}</div>
    <div style="font-size:20px;font-weight:750">${yearRead}${goal ? ' / ' + goal : ''} <span class="muted" style="font-size:14px;font-weight:600">livre${yearRead > 1 ? 's' : ''}</span></div>
    <div class="muted small">${goal ? (yearRead >= goal ? 'Défi réussi ! 🏆' : `Encore ${goal - yearRead} · ${aheadLabel(yearRead, goal)}`) : '<button class="link" onclick="go(\'me\')">Fixer un objectif annuel →</button>'}</div></div></div>`;
  // KPI par format
  const kp = [
    ['📚', read.length, 'Livres terminés'],
    ['📖', pages.toLocaleString('fr-FR'), 'Pages lues'],
    ['🎧', minutes ? fmtMin(minutes) : '0 h', 'Écoutées'],
    ['🖼', chapters.toLocaleString('fr-FR'), 'Chapitres lus'],
    ['⏱', fmtDur(readSec, true), 'Temps de lecture'],
    ['🔥', streak() + ' j', 'Série en cours']
  ];
  h += `<div class="kpis">${kp.map(([i, v, l]) => `<div class="kpi"><div class="ic">${i}</div><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}</div>`;
  // 14 derniers jours (pages / minutes / chapitres)
  const days = []; for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const lbl = days.map((d, i) => i === 13 ? 'auj.' : i % 2 ? d.getDate() : '');
  const pv = days.map(d => (m[dayKey(d)] || {}).pages || 0);
  h += `<div class="card chart-card"><h3>📖 Pages par jour</h3><div class="muted small">14 derniers jours · ${pv.reduce((a, b) => a + b, 0)} pages</div>${barChart(pv, lbl, { goal: +S.settings.dailyGoal || 0, goalLabel: 'objectif ' + (+S.settings.dailyGoal || 0) + ' p.' })}</div>`;
  if (S.logs.some(l => l.unit === 'min')) {
    const av = days.map(d => (m[dayKey(d)] || {}).min || 0);
    h += `<div class="card chart-card"><h3>🎧 Écoute par jour</h3><div class="muted small">14 derniers jours · ${fmtMin(av.reduce((a, b) => a + b, 0))}</div>${barChart(av, lbl, { color: '#06B6D4', min: 30 })}</div>`;
  }
  if (S.logs.some(l => l.unit === 'ch')) {
    const cv = days.map(d => (m[dayKey(d)] || {}).ch || 0);
    h += `<div class="card chart-card"><h3>🖼 Chapitres par jour</h3><div class="muted small">14 derniers jours · ${cv.reduce((a, b) => a + b, 0)} chapitres</div>${barChart(cv, lbl, { color: '#F59E0B', min: 5, values: true })}</div>`;
  }
  // Régularité
  const start = new Date(); start.setDate(start.getDate() - 83);
  start.setDate(start.getDate() - (start.getDay() + 6) % 7);
  let cells = ''; const today = new Date();
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const t = m[dayKey(d)] || {}; const v = (t.pages || 0) + (t.min || 0) / 2 + (t.ch || 0) * 5;
    const lv = v === 0 ? 0 : v < 10 ? 1 : v < 25 ? 2 : v < 50 ? 3 : 4;
    const op = [0, .3, .55, .8, 1][lv];
    cells += `<i style="${lv ? `background:color-mix(in srgb,var(--primary) ${op * 100}%,var(--surface-2))` : ''}"></i>`;
  }
  h += `<div class="card chart-card"><h3>Régularité</h3><div class="muted small">12 dernières semaines · tous formats</div><div class="heat">${cells}</div>
    <div class="legend">moins ${[0, .3, .55, .8, 1].map(o => `<i style="background:${o ? `color-mix(in srgb,var(--primary) ${o * 100}%,var(--surface-2))` : 'var(--surface-2)'}"></i>`).join('')} plus</div></div>`;
  // Livres terminés par mois (12 mois)
  const months = []; for (let i = 11; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); months.push(d); }
  const mv = months.map(d => allRead.filter(b => b.finishedAt && new Date(b.finishedAt).getMonth() === d.getMonth() && new Date(b.finishedAt).getFullYear() === d.getFullYear()).length);
  h += `<div class="card chart-card"><h3>Livres terminés</h3><div class="muted small">12 derniers mois</div>${barChart(mv, months.map(d => d.toLocaleDateString('fr-FR', { month: 'narrow' })), { color: 'var(--accent)', min: 2, values: true })}</div>`;
  // Par format & par genre
  if (read.length) {
    const fr = Object.entries(FORMATS).map(([k, f]) => ({ l: f.e + ' ' + f.l, v: read.filter(b => (b.format || 'paper') === k).length })).filter(r => r.v);
    h += `<div class="card chart-card"><h3>Par format</h3><div class="muted small">${per[statsPeriod]} · livres terminés</div><div style="margin-top:12px">${hbars(fr)}</div></div>`;
    const gr = allTags().map(t => ({ l: t.e + ' ' + esc(t.l), v: read.filter(b => (b.tags || []).includes(t.id)).length })).filter(r => r.v).sort((a, b) => b.v - a.v);
    if (gr.length) h += `<div class="card chart-card"><h3>Par genre</h3><div class="muted small">${per[statsPeriod]} · livres terminés</div><div style="margin-top:12px">${hbars(gr)}</div></div>`;
    const rated = read.filter(b => b.rating);
    if (rated.length) {
      const avg = rated.reduce((a, b) => a + b.rating, 0) / rated.length;
      const top = [...rated].sort((a, b) => b.rating - a.rating || (b.finishedAt || 0) - (a.finishedAt || 0)).slice(0, 5);
      h += `<div class="card chart-card"><h3>Mes coups de cœur</h3><div class="muted small">Note moyenne ${avg.toFixed(1).replace('.', ',')} ★ sur ${rated.length} livre${rated.length > 1 ? 's' : ''}</div>
        <div class="hscroll" style="margin-top:10px">${top.map(b => `<div class="mini" data-open="${b.id}">${coverHTML(b, '')}<div class="t">${esc(b.title)}</div><div class="stars">${'★'.repeat(b.rating)}</div></div>`).join('')}</div></div>`;
    }
    const authors = {}; read.forEach(b => { const a = firstAuthor(b.author); if (a) authors[a] = (authors[a] || 0) + 1; });
    const ta = Object.entries(authors).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([l, v]) => ({ l: esc(l), v }));
    if (ta.length) h += `<div class="card chart-card"><h3>Auteurs les plus lus</h3><div style="margin-top:12px">${hbars(ta)}</div></div>`;
  }
  // Rythmes
  const sp = logs.filter(l => l.type === 'session' && l.seconds > 60 && (l.unit || 'p') === 'p');
  const pace = sp.reduce((a, l) => a + l.pages, 0) / (sp.reduce((a, l) => a + l.seconds, 0) / 3600 || 1);
  const pageBooks = read.filter(b => unitOf(b) === 'p' && b.pages);
  const avgLen = pageBooks.length ? Math.round(pageBooks.reduce((a, b) => a + b.pages, 0) / pageBooks.length) : 0;
  const durs = read.filter(b => b.startedAt && b.finishedAt && b.finishedAt > b.startedAt).map(b => (b.finishedAt - b.startedAt) / 864e5);
  const avgDays = durs.length ? Math.max(1, Math.round(durs.reduce((a, b) => a + b, 0) / durs.length)) : 0;
  h += `<div class="kpis" style="margin-top:14px">
    <div class="kpi"><div class="l">Rythme moyen</div><div class="v">${sp.length ? Math.round(pace) : '—'}</div><div class="l">pages / heure</div></div>
    <div class="kpi"><div class="l">Livre moyen</div><div class="v">${avgLen || '—'}</div><div class="l">pages</div></div>
    <div class="kpi"><div class="l">Temps pour finir</div><div class="v">${avgDays ? avgDays + ' j' : '—'}</div><div class="l">en moyenne</div></div>
    <div class="kpi"><div class="l">Sessions</div><div class="v">${logs.filter(l => l.type === 'session').length}</div><div class="l">${per[statsPeriod].toLowerCase()}</div></div></div>`;
  return h;
}
function aheadLabel(done, goal) {
  const now = new Date(), y = now.getFullYear();
  const frac = (now - new Date(y, 0, 1)) / (new Date(y + 1, 0, 1) - new Date(y, 0, 1));
  const expected = goal * frac, diff = Math.round(done - expected);
  return diff > 0 ? `${diff} d’avance 🚀` : diff < 0 ? `${-diff} de retard` : 'pile dans les temps ✨';
}

const NATIVE = () => window.KiriaAndroid || null;

/* Sauvegarde automatique dans Téléchargements/LaBulleDeKiria/sauvegarde-auto.json */
let autoT = null;
function scheduleAutoBackup() {
  const nat = NATIVE(); if (!nat || !nat.autoBackup || !S.books.length) return;

    const r = nat.autoBackup(backupJSON());

function applyBackup(text) {
  const d = JSON.parse(text);
  if (!Array.isArray(d.books)) throw new Error('format');
  S.books = d.books; S.logs = d.logs || []; S.shelves = d.shelves || []; S.radar = Object.assign({ items: [] }, d.radar || {}); S.settings = Object.assign({}, DEFAULT.settings, d.settings || {}); save();

}
function openImport() {
  const sh = openSheet('Importer une sauvegarde', `<p class="muted small" style="margin-top:0">Choisis le fichier de sauvegarde (par ex. dans Téléchargements/LaBulleDeKiria), ou colle son contenu. Il remplacera les données actuelles.</p>

/* ---------- Feuilles (bottom sheets) ---------- */
const stack = [];
function openSheet(title, body) {
  const root = document.getElementById('sheets');
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = `<div class="grab"></div><div class="sh"><h2>${title}</h2><button class="x" aria-label="Fermer">✕</button></div><div class="sb">${body}</div>`;
  root.append(scrim, sh);
  scrim.onclick = closeSheet; sh.querySelector('.x').onclick = closeSheet;
  requestAnimationFrame(() => { scrim.classList.add('show'); sh.classList.add('show'); });
  stack.push({ scrim, sh });
  return sh;
}
function closeSheet() {
  const s = stack.pop(); if (!s) return;
  s.scrim.classList.remove('show'); s.sh.classList.remove('show');
  setTimeout(() => { s.scrim.remove(); s.sh.remove(); }, 300);
}
function closeAll() { while (stack.length) closeSheet(); }

/* ---------- Compléter une fiche (couverture, résumé) ---------- */
async function enrichBook(b) {
  const isbn = isbn13(b.isbn);
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  const found = {};
  const take = x => { for (const f of ['cover', 'description', 'pages', 'publisher', 'year', 'genre']) if (!found[f] && x[f]) found[f] = x[f]; };
  const tries = [];
  if (isbn) tries.push(fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:' + isbn).then(r => r.json()).then(d => (d.items || []).map(gbMap).forEach(take)));
  if (b.title) tries.push(fetch('https://www.googleapis.com/books/v1/volumes?maxResults=20&langRestrict=fr&q=' + encodeURIComponent('intitle:' + b.title + (b.author ? ' inauthor:' + b.author.split(',')[0] : '')))
    .then(r => r.json()).then(d => (d.items || []).map(gbMap).filter(x => norm(x.title).startsWith(norm(b.title).slice(0, 12)) && (isbnLang(x.isbn) === 'fr' || (!x.isbn && x.lang === 'fr')))
      .sort((x, y) => (y.isbn === isbn) - (x.isbn === isbn)).forEach(take)));
  await Promise.all(tries.map(t => t.catch(() => null)));
  if (b.title && (!found.cover || !found.description || !b.releaseDate)) {
    try {
      const l = await appleSearch(b.title + (b.author ? ' ' + b.author.split(',')[0] : ''));
      const k = normKey(b.title);
      const m = l.filter(x => normKey(x.title) === k || normKey(x.title).startsWith(k.slice(0, 14))).sort((x, y) => (y.lang === 'fr') - (x.lang === 'fr'))[0];
      if (m && m.lang !== 'en') { take(m); if (m.releaseDate && !found.releaseDate) found.releaseDate = m.releaseDate; }
    } catch (e) { }
  }
  if (!found.cover && isbn) {
    const ok = await new Promise(res => { const i = new Image(); i.onload = () => res(i.naturalWidth > 20); i.onerror = () => res(false); i.src = `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`; setTimeout(() => res(false), 8000); });
    if (ok) found.cover = `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`;
  }
  return found;
}

/* Image de la galerie → petite image JPEG gardée dans l'app */
function pickImage() {
  return new Promise((res, rej) => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return rej(new Error('aucune image'));
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          const H = 480, scale = Math.min(1, H / img.height);
          const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => rej(new Error('image illisible')); img.src = fr.result;
      };
      fr.readAsDataURL(f);
    };
    inp.click();
  });
}

    if (f.description && !$('desc').value.trim()) { $('desc').value = f.description.replace(/<[^>]+>/g, ''); n++; }
    if (f.pages && !$('pages').value) { $('pages').value = f.pages; }
    if (f.releaseDate && !$('release').value) { $('release').value = f.releaseDate; n++; }
    btn.textContent = '✨ Trouver couverture & résumé'; btn.disabled = false;
    toast(n ? 'Infos trouvées ✨' : 'Rien trouvé — tu peux les ajouter à la main');
  };
  $('save').onclick = () => {
    const v = k => $(k).value.trim();
    if (!v('title')) { toast('Le titre est obligatoire'); return; }
    const tot = FORMATS[fmt].u === 'min' ? parseDur(v('pages')) : Math.max(0, parseInt(v('pages')) || 0);
    const data = { title: v('title'), author: v('author'), pages: tot, year: v('year') || (v('release') || '').slice(0, 4), format: fmt, tags: [...etags],
      publisher: v('pub'), isbn: v('isbn'), cover, cover2, description: v('desc'), releaseDate: v('release') };
    if (!data.tags.length) data.tags = classify(data);
    if (data.isbn && isbnLang(data.isbn)) data.lang = isbnLang(data.isbn);
    if (id) { Object.assign(b, data); if (b.status === 'read' && b.pages) b.currentPage = b.pages; if (b.pages && b.currentPage > b.pages) b.currentPage = b.pages; save(); closeSheet(); closeSheet(); openBook(id); render(); toast('Fiche enregistrée'); }
    else { closeSheet(); chooseStatus(data); }
  };
}

/* ---------- Fiche livre ---------- */
function openBook(id) {
  const b = book(id); if (!b) return;
  const logs = S.logs.filter(l => l.bookId === id).sort((a, c) => c.at - a.at);
  const totalSec = logs.reduce((a, l) => a + (l.seconds || 0), 0);
  const f0 = fmtOf(b);
  const chips = [f0.e + ' ' + f0.l, b.lang ? langBadge(b.lang) : '', b.pages ? (f0.u === 'min' ? `⏳ ${fmtMin(b.pages)}` : f0.u === 'ch' ? `🖼 ${b.pages} chapitres` : `📄 ${b.pages} pages`) : '', b.year ? `📅 ${esc(b.year)}` : '', b.publisher ? `🏢 ${esc(b.publisher)}` : '', b.genre ? `🏷 ${esc(b.genre)}` : '', totalSec ? `⏱ ${fmtDur(totalSec)}` : '']
    .filter(Boolean).map(c => `<span class="chip">${c}</span>`).join('');
  let main = '';
  if (b.status === 'reading') {
    const left = b.pages ? b.pages - (b.currentPage || 0) : 0;
    main = `<div class="card row" style="gap:16px">${ring(b.currentPage || 0, b.pages || 0, 76, 8, b.pages ? undefined : (f0.u === 'ch' ? 'Ch.' + (b.currentPage || 0) : f0.e))}
      <div style="flex:1"><div style="font-weight:700;font-size:17px">${progLabel(b, true)}</div>
      <div class="muted small">${b.pages ? `Encore ${qtyLabel(left, f0.u)}` : f0.u === 'ch' ? 'Série en cours de parution' : 'Ajoute le total via « Modifier la fiche »'}</div>
      ${b.startedAt ? `<div class="muted small">Commencé le ${fmtDate(b.startedAt, { day: 'numeric', month: 'long' })}</div>` : ''}</div></div>
      <div class="row" style="margin-top:12px;gap:10px"><button class="btn accent" style="flex:1;padding:13px" data-session="${b.id}">${f0.u === 'min' ? '🎧 Session d’écoute' : '▶ Démarrer une session'}</button><button class="btn" style="padding:13px" data-progress="${b.id}">${f0.add}</button></div>`;
  } else if (b.status === 'toread') {
    const pos = palList().findIndex(x => x.id === b.id) + 1;
    main = `<div class="muted small" style="text-align:center;margin-bottom:10px">N° ${pos} dans ta PAL</div><button class="btn accent block" id="d-start">📖 Commencer la lecture</button>`;
  } else if (b.status === 'wish') {
    main = `<div class="card"><div class="field" style="margin-bottom:8px"><label>Date de sortie (facultatif)</label><input id="d-release" type="date" value="${esc(b.releaseDate || '')}"></div>
      <div class="muted small" id="d-rel-lbl">${releaseLabel(b)}</div></div>
      <button class="btn accent block" style="margin-top:12px" id="d-got">🛒 Je l’ai ! → dans ma PAL</button>`;
  } else {
    main = `<div class="card" style="text-align:center"><div class="muted small" style="font-weight:600">Ta note</div>
      <div class="rate" id="d-rate">${[1, 2, 3, 4, 5].map(n => `<button data-r="${n}" class="${n <= (b.rating || 0) ? 'on' : ''}">★</button>`).join('')}</div>
      ${b.finishedAt ? `<div class="muted small">Terminé le ${fmtDate(b.finishedAt, { day: 'numeric', month: 'long', year: 'numeric' })}</div>` : ''}</div>`;
  }
  const sh = openSheet('', `
    <div class="detail-top">${coverHTML(b, 'c-lg')}<div style="min-width:0"><h2>${esc(b.title)}</h2><div class="muted" style="margin-top:6px">${esc(b.author || 'Auteur inconnu')}</div>
      ${b.isbn ? `<div class="muted small" style="margin-top:4px">ISBN ${esc(b.isbn)}</div>` : ''}</div></div>
    <div class="chips">${chips}</div>
    <div class="pills">${[['wish', '💫 Wish'], ['toread', '🫧 PAL'], ['reading', '📖 En cours'], ['read', '🏁 Lu']].map(([k, l]) => `<button data-st="${k}" class="${b.status === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${main}
    ${b.description ? `<div class="section"><div class="section-h"><h2>Résumé</h2></div><div class="desc" id="d-desc">${esc(b.description.replace(/<[^>]+>/g, ''))}</div><button class="link" id="d-more" style="margin-top:6px">Lire plus</button></div>` : ''}
    <div class="section"><div class="section-h"><h2>Mes notes</h2></div><div class="field" style="margin:0"><textarea id="d-notes" rows="3" placeholder="Citations, impressions, personnages…">${esc(b.notes || '')}</textarea></div></div>
    ${logs.length ? `<div class="section"><div class="section-h"><h2>Historique</h2><span class="muted small">${logs.length} entrée${logs.length > 1 ? 's' : ''}</span></div><div class="card">${logs.slice(0, 30).map(l => histRow(l)).join('')}</div></div>` : ''}
    <div class="section"><div class="section-h"><h2>Genres</h2></div>
      <div class="chips" id="d-tags">${allTags().map(t => `<button class="chip ${(b.tags || []).includes(t.id) ? 'p' : ''}" data-tg="${t.id}">${t.e} ${esc(t.l)}</button>`).join('')}</div></div>
    <div class="section"><div class="section-h"><h2>Mes piles</h2></div>
      <div class="chips" id="d-shelves">${S.shelves.map(sh => `<button class="chip ${(sh.books || []).includes(b.id) ? 'p' : ''}" data-shelf="${sh.id}">${(sh.books || []).includes(b.id) ? '✓ ' : ''}${sh.emoji} ${esc(sh.name)}</button>`).join('')}
      <button class="chip" id="d-newshelf">＋ Nouvelle pile</button></div></div>
    <a class="btn block" style="margin-top:24px;text-decoration:none" href="${esc(b.link && /fnac\.com/.test(b.link) ? b.link : FNAC_SEARCH(b.title + ' ' + firstAuthor(b.author)))}">🛒 Voir sur la Fnac</a>
    <button class="btn block" style="margin-top:10px" id="d-edition">🔄 Changer d’édition</button>
    <div class="row" style="margin-top:10px;gap:10px"><button class="btn" style="flex:1" id="d-edit">✎ Modifier la fiche</button><button class="btn danger" style="flex:1" id="d-del">Supprimer</button></div>`);
  sh.querySelector('.sh').style.padding = '0 18px';
  bindView(sh);
  sh.querySelectorAll('[data-st]').forEach(p => p.onclick = () => { setStatus(b, p.dataset.st); closeSheet(); setTimeout(() => openBook(id), 150); });
  sh.querySelector('#d-release')?.addEventListener('change', e => { b.releaseDate = e.target.value; save(); render(); sh.querySelector('#d-rel-lbl').textContent = releaseLabel(b); });
  sh.querySelector('#d-got')?.addEventListener('click', () => { setStatus(b, 'toread'); closeSheet(); toast('Ajouté à ta PAL 🫧'); setTimeout(() => openBook(id), 150); });
  sh.querySelector('#d-start')?.addEventListener('click', () => { setStatus(b, 'reading'); closeSheet(); setTimeout(() => openBook(id), 150); });
  sh.querySelectorAll('#d-rate [data-r]').forEach(s => s.onclick = () => {
    b.rating = +s.dataset.r; save(); render(); sh.querySelectorAll('#d-rate [data-r]').forEach(x => x.classList.toggle('on', +x.dataset.r <= b.rating));
  });
  sh.querySelector('#d-more')?.addEventListener('click', e => { sh.querySelector('#d-desc').classList.toggle('open'); e.target.textContent = sh.querySelector('#d-desc').classList.contains('open') ? 'Réduire' : 'Lire plus'; });
  sh.querySelector('#d-notes').onchange = e => { b.notes = e.target.value; save(); toast('Note enregistrée'); };
  sh.querySelector('#d-edit').onclick = () => openEdit(id);
  sh.querySelectorAll('#d-tags [data-tg]').forEach(c => c.onclick = () => { b.tags = b.tags || []; const t = c.dataset.tg, i = b.tags.indexOf(t); i >= 0 ? b.tags.splice(i, 1) : b.tags.push(t); c.classList.toggle('p', i < 0); save(); render(); });
  sh.querySelector('#d-edition').onclick = () => openAdd(id);
  sh.querySelectorAll('[data-shelf]').forEach(c => c.onclick = () => {
    const s2 = shelf(c.dataset.shelf), added = toggleInShelf(s2, id);
    c.classList.toggle('p', added); c.textContent = (added ? '✓ ' : '') + s2.emoji + ' ' + s2.name; render();
    toast(added ? `Ajouté à « ${s2.name} »` : `Retiré de « ${s2.name} »`);
  });
  sh.querySelector('#d-newshelf').onclick = () => openShelfEditor(null, nid => { toggleInShelf(shelf(nid), id); closeSheet(); setTimeout(() => openBook(id), 150); });
  sh.querySelector('#d-del').onclick = () => {
    const c = openSheet('Supprimer ce livre ?', `<p class="muted" style="margin-top:0">« ${esc(b.title)} » et son historique de lecture seront supprimés.</p>
      <button class="btn block" style="background:var(--danger);color:#fff" id="c-yes">Supprimer</button><button class="btn block" style="margin-top:10px" id="c-no">Annuler</button>`);
    c.querySelector('#c-no').onclick = closeSheet;
    c.querySelector('#c-yes').onclick = () => { S.books = S.books.filter(x => x.id !== id); S.logs = S.logs.filter(l => l.bookId !== id); S.shelves.forEach(x => x.books = (x.books || []).filter(i => i !== id)); save(); closeAll(); render(); toast('Livre supprimé'); };
  };
}
function setStatus(b, st) {
  if (b.status === st) return;
  b.status = st;
  if (st === 'reading' && !b.startedAt) b.startedAt = Date.now();
  if (st === 'read') { finishBook(b, true); return; }
  if (st === 'toread') { b.finishedAt = null; b.palOrder = palNext(); }
  if (st === 'wish') { b.finishedAt = null; }
  if (st === 'reading') b.finishedAt = null;
  save(); render();
}
function finishBook(b, silent) {
  b.status = 'read'; b.finishedAt = Date.now(); if (b.pages) b.currentPage = b.pages;
  S.logs.push({ id: uid(), bookId: b.id, type: 'finish', date: dayKey(), at: Date.now(), pages: 0, seconds: 0, unit: unitOf(b) });
  save(); render(); bubbles(); toast('Livre terminé ! Bravo 🎉');
}

/* ---------- Progression ---------- */
function logProgress(b, newPage, seconds, type) {
  newPage = Math.max(0, Math.round(newPage));
  if (b.pages) newPage = Math.min(newPage, b.pages);
  const delta = Math.max(0, newPage - (b.currentPage || 0));
  b.currentPage = newPage; b.lastReadAt = Date.now();
  if (b.status === 'toread' || b.status === 'wish') { b.status = 'reading'; b.startedAt ||= Date.now(); }
  const u = unitOf(b);
  if (delta || seconds) S.logs.push({ id: uid(), bookId: b.id, type, date: dayKey(), at: Date.now(), pages: delta, seconds: Math.round(seconds || 0), unit: u });
  save();
  if (b.pages && newPage >= b.pages && b.status !== 'read') finishBook(b);
  else { render(); toast(delta ? `+${qtyLabel(delta, u)} ${fmtOf(b).e}` : 'Session enregistrée'); }
  const today = dayTotals()[dayKey()]?.pages || 0, goal = +S.settings.dailyGoal;
  if (u === 'p' && delta && today >= goal && today - delta < goal) setTimeout(() => { bubbles(); toast('Objectif du jour atteint ! 🌟'); }, 900);
}
function openProgress(id, seconds) {
  const b = book(id); if (!b) return;
  const cur = b.currentPage || 0, u = unitOf(b), audio = u === 'min';
  const start = audio && seconds != null ? Math.min(b.pages || 1e6, cur + Math.round(seconds / 60)) : cur;
  const label = audio ? `Position d’écoute (ex. 3h20)${b.pages ? ' sur ' + fmtMin(b.pages) : ''}` : u === 'ch' ? `Chapitre atteint${b.pages ? ` (sur ${b.pages})` : ''}` : `Page atteinte ${b.pages ? `(sur ${b.pages})` : ''}`;
  const steps = audio ? [15, 30, 60, 120] : u === 'ch' ? [1, 3, 5, 10] : [5, 10, 20, 50];
  const sh = openSheet(seconds != null ? 'Fin de session' : (audio ? 'Où en est ton écoute ?' : 'Où en es-tu ?'), `
    ${seconds != null ? `<div class="card row" style="margin-bottom:16px"><div style="font-size:26px">${audio ? '🎧' : '⏱'}</div><div><div style="font-weight:700">${fmtDur(seconds)} ${audio ? 'd’écoute' : 'de lecture'}</div><div class="muted small">${esc(b.title)}</div></div></div>` : `<p class="muted" style="margin-top:0">${esc(b.title)}</p>`}
    <div class="field"><label>${label}</label>
      <input id="p-page" ${audio ? 'inputmode="text"' : 'type="number" inputmode="numeric"'} value="${audio ? fmtMin(start).replace(/ /g, '') : start}" min="0" ${b.pages && !audio ? `max="${b.pages}"` : ''} style="font-size:24px;font-weight:700;text-align:center"></div>
    <div class="row" style="gap:8px;margin-bottom:16px">${steps.map(n => `<button class="btn sm" style="flex:1" data-add="${n}">+${audio ? fmtMin(n).replace(/ /g, '') : n}</button>`).join('')}</div>
    <button class="btn primary block" id="p-save">Enregistrer</button>
    ${b.pages || u === 'ch' ? `<button class="btn block" style="margin-top:10px" id="p-done">🏁 J’ai terminé${u === 'ch' ? ' (série finie)' : ''}</button>` : ''}`);
  const inp = sh.querySelector('#p-page');
  const val = () => audio ? parseDur(inp.value) : (+inp.value || 0);
  sh.querySelectorAll('[data-add]').forEach(x => x.onclick = () => { const n = Math.min(b.pages || 1e6, val() + +x.dataset.add); inp.value = audio ? fmtMin(n).replace(/ /g, '') : n; });
  sh.querySelector('#p-save').onclick = () => { closeSheet(); logProgress(b, val(), seconds, seconds != null ? 'session' : 'update'); };
  sh.querySelector('#p-done')?.addEventListener('click', () => { closeSheet(); closeAll(); if (b.pages) logProgress(b, b.pages, seconds, seconds != null ? 'session' : 'update'); else { logProgress(b, Math.max(val(), cur), seconds, seconds != null ? 'session' : 'update'); finishBook(b); } });
  setTimeout(() => { inp.focus(); inp.select(); }, 350);
}

/* ---------- Sessions chronométrées ---------- */
const sesEl = document.getElementById('session');
let sesTick;
function sesElapsed() { const s = S.session; if (!s) return 0; return s.acc + (s.runningSince ? (Date.now() - s.runningSince) / 1000 : 0); }
function startSession(id) {
  const b = book(id); if (!b) return;
  if (b.status !== 'reading') setStatus(b, 'reading');
  closeAll();
  S.session = { bookId: id, acc: 0, runningSince: Date.now() }; save();
  showSession();
}
function showSession() {
  const b = book(S.session.bookId); if (!b) { S.session = null; save(); return; }
  document.getElementById('ses-title').textContent = b.title;
  document.querySelector('#session .lbl').textContent = unitOf(b) === 'min' ? 'Session d’écoute' : 'Session de lecture';
  sesEl.classList.add('show');
  try { window.KiriaAndroid?.keepAwake?.(true); } catch (e) { }
  const upd = () => {
    const t = Math.floor(sesElapsed()), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    document.getElementById('ses-timer').textContent = (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
    document.getElementById('ses-pause').textContent = S.session.runningSince ? '❚❚' : '▶';
    document.getElementById('ses-hint').textContent = S.session.runningSince ? 'Bonne lecture dans ta bulle ✨' : 'En pause';
  };
  upd(); clearInterval(sesTick); sesTick = setInterval(upd, 500);
}
document.getElementById('ses-pause').onclick = () => {
  const s = S.session; if (!s) return;
  if (s.runningSince) { s.acc += (Date.now() - s.runningSince) / 1000; s.runningSince = null; } else s.runningSince = Date.now();
  save();
};
document.getElementById('ses-stop').onclick = endSession;
function endSession() {
  const secs = sesElapsed(), id = S.session.bookId;
  clearInterval(sesTick); S.session = null; save();
  sesEl.classList.remove('show');
  try { window.KiriaAndroid?.keepAwake?.(false); } catch (e) { }
  setTimeout(() => openProgress(id, secs), 250);
}

/* ---------- Bouton retour Android ---------- */
window.kiriaBack = function () {
  if (stack.length) { closeSheet(); return true; }
  if (S.session) { toast('Appuie sur ■ pour terminer la session'); return true; }
  if (tab === 'library' && libFilter.startsWith('shelf:')) { libFilter = 'toread'; render(); return true; }
  if (tab !== 'home') { go('home'); return true; }
  return false;
};

S.books.forEach(b => { if (!b.format) b.format = 'paper'; if (!b.tags) b.tags = classify(b); });
radarState();
render();
if (S.session) showSession();
setTimeout(maybeAutoRadar, 2500);
</script>
</body>
